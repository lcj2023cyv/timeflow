<script>
// ═══════════════════════════════════════════════════════════════
// Encrypted IndexedDB Storage Layer (AES-256-GCM)
// ═══════════════════════════════════════════════════════════════
const DB_NAME='timeflow';const DB_VER=3;
const STORES=['categories','goals','entries','habit_logs','tracking_entries','settings','life_values','budgets','budget_categories','budget_entries','lessons','fitness_plans','fitness_days','fitness_exercises','fitness_sessions','session_sets','fitness_goals','weight_logs'];
let _db=null;
let _cryptoKey=null; // AES key derived from password, lives only in memory

// --- Crypto helpers (Web Crypto API, no external libs) ---
const SALT_KEY='tf_salt';const VERIFY_KEY='tf_verify';
function getSalt(){let s=localStorage.getItem(SALT_KEY);if(!s){const arr=new Uint8Array(16);crypto.getRandomValues(arr);s=btoa(String.fromCharCode(...arr));localStorage.setItem(SALT_KEY,s)}return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function deriveKey(password){
  const enc=new TextEncoder().encode(password);
  const keyMaterial=await crypto.subtle.importKey('raw',enc,'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:getSalt(),iterations:100000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encrypt(data){
  if(!_cryptoKey)return data; // fallback: no encryption if no key
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const encoded=new TextEncoder().encode(JSON.stringify(data));
  const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},_cryptoKey,encoded);
  return{_enc:btoa(String.fromCharCode(...new Uint8Array(encrypted))),_iv:btoa(String.fromCharCode(...iv))}
}
async function decrypt(record){
  if(!record||!record._enc||!_cryptoKey)return record;
  try{
    const iv=Uint8Array.from(atob(record._iv),c=>c.charCodeAt(0));
    const data=Uint8Array.from(atob(record._enc),c=>c.charCodeAt(0));
    const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv},_cryptoKey,data);
    const obj=JSON.parse(new TextDecoder().decode(decrypted));
    obj.id=record.id;return obj;
  }catch(e){console.error('Decrypt error:',e);return null}
}
// Verify password: encrypt a known string, store it. On login, try to decrypt it.
async function setVerification(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const encoded=new TextEncoder().encode('timeflow_ok');
  const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},_cryptoKey,encoded);
  localStorage.setItem(VERIFY_KEY,JSON.stringify({d:btoa(String.fromCharCode(...new Uint8Array(encrypted))),v:btoa(String.fromCharCode(...iv))}));
}
async function checkPassword(password){
  _cryptoKey=await deriveKey(password);
  const stored=localStorage.getItem(VERIFY_KEY);
  if(!stored){await setVerification();return true} // first time = set password
  try{
    const{d,v}=JSON.parse(stored);
    const iv=Uint8Array.from(atob(v),c=>c.charCodeAt(0));
    const data=Uint8Array.from(atob(d),c=>c.charCodeAt(0));
    const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv},_cryptoKey,data);
    const text=new TextDecoder().decode(decrypted);
    if(text==='timeflow_ok')return true;
    _cryptoKey=null;return false;
  }catch(e){_cryptoKey=null;return false}
}
function isFirstTime(){return !localStorage.getItem(VERIFY_KEY)}
function isUnlocked(){return _cryptoKey!==null}

// --- IndexedDB ---
function openDB(){return new Promise((res,rej)=>{if(_db)return res(_db);const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const db=e.target.result;STORES.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id',autoIncrement:true})})};r.onsuccess=e=>{_db=e.target.result;res(_db)};r.onerror=e=>rej(e)})}

async function dbAll(store){
  const db=await openDB();
  const raw=await new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e)});
  const results=await Promise.all(raw.map(r=>decrypt(r)));
  return results.filter(Boolean);
}
async function dbGet(store,id){
  const db=await openDB();
  const raw=await new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).get(Number(id));r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e)});
  return raw?await decrypt(raw):null;
}
async function dbAdd(store,obj){
  const db=await openDB();
  const enc=await encrypt(obj);
  return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).add(enc);r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e)});
}
async function dbPut(store,obj){
  const db=await openDB();
  const id=obj.id;const enc=await encrypt(obj);enc.id=id;
  return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).put(enc);r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e)});
}
async function dbDel(store,id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).delete(Number(id));r.onsuccess=()=>res();r.onerror=e=>rej(e)})}
const today=()=>new Date().toISOString().slice(0,10);
const nextId=(arr)=>arr.length?Math.max(...arr.map(x=>x.id||0))+1:1;

// --- Auto-Backup: encrypted snapshot in localStorage ---
const BACKUP_KEY='tf_backup';const BACKUP_TS_KEY='tf_backup_ts';
async function createBackup(){
  if(!_cryptoKey)return;
  try{
    const data={};
    for(const store of STORES){data[store]=await dbAll(store)}
    const json=JSON.stringify(data);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const encoded=new TextEncoder().encode(json);
    const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},_cryptoKey,encoded);
    const payload=JSON.stringify({
      d:btoa(String.fromCharCode(...new Uint8Array(encrypted))),
      v:btoa(String.fromCharCode(...iv)),
      t:new Date().toISOString(),
      n:Object.values(data).reduce((s,a)=>s+a.length,0)
    });
    localStorage.setItem(BACKUP_KEY,payload);
    localStorage.setItem(BACKUP_TS_KEY,new Date().toISOString());
    console.log('Backup created:',new Date().toLocaleTimeString());
    return true;
  }catch(e){console.error('Backup error:',e);return false}
}
async function restoreFromBackup(){
  if(!_cryptoKey)return false;
  const raw=localStorage.getItem(BACKUP_KEY);
  if(!raw)return false;
  try{
    const{d,v}=JSON.parse(raw);
    const iv=Uint8Array.from(atob(v),c=>c.charCodeAt(0));
    const enc=Uint8Array.from(atob(d),c=>c.charCodeAt(0));
    const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv},_cryptoKey,enc);
    const data=JSON.parse(new TextDecoder().decode(decrypted));
    const db=await openDB();
    for(const store of Object.keys(data)){
      if(!db.objectStoreNames.contains(store))continue;
      const items=data[store];if(!items||!items.length)continue;
      const tx=db.transaction(store,'readwrite');const s=tx.objectStore(store);
      for(const item of items){
        const enc=await encrypt(item);enc.id=item.id;
        try{s.put(enc)}catch(e){}
      }
      await new Promise(r=>{tx.oncomplete=r});
    }
    console.log('Restored from backup');
    return true;
  }catch(e){console.error('Restore error:',e);return false}
}
async function hasData(){
  const db=await openDB();
  const tx=db.transaction('categories','readonly');
  const count=await new Promise(r=>{const req=tx.objectStore('categories').count();req.onsuccess=()=>r(req.result)});
  return count>0;
}
function getBackupInfo(){
  const raw=localStorage.getItem(BACKUP_KEY);
  if(!raw)return null;
  try{const{t,n}=JSON.parse(raw);return{timestamp:t,records:n}}catch(e){return null}
}

// ═══════════════════════════════════════════════════════════════
// Local API - replaces server calls
// ═══════════════════════════════════════════════════════════════
const localHandlers={};
// --- Categories ---
localHandlers['GET categories']=async()=>{const c=await dbAll('categories');return c.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))};
localHandlers['POST categories']=async(d)=>{const all=await dbAll('categories');const o={name:d.name,description:d.description||'',sort_order:all.length,created_at:new Date().toISOString()};const id=await dbAdd('categories',{...o,id:undefined});return{id,name:d.name}};
localHandlers['PUT categories/:id']=async(d,id)=>{const c=await dbGet('categories',id);if(c){c.name=d.name;c.description=d.description||'';await dbPut('categories',c)}return{status:'ok'}};
localHandlers['DELETE categories/:id']=async(_,id)=>{id=Number(id);const entries=await dbAll('entries');for(const e of entries)if(e.category_id==id)await dbDel('entries',e.id);const goals=await dbAll('goals');for(const g of goals)if(g.category_id==id)await dbDel('goals',g.id);await dbDel('categories',id);return{status:'ok'}};
// --- Reorder ---
localHandlers['POST reorder']=async(d)=>{const store=d.table==='categories'?'categories':d.table==='goals'?'goals':d.table==='lessons_learned'?'lessons':d.table;const ids=d.ids||[];for(let i=0;i<ids.length;i++){const obj=await dbGet(store,ids[i]);if(obj){obj.sort_order=i;await dbPut(store,obj)}}return{status:'ok'}};
// --- Goals ---
localHandlers['GET goals']=async()=>{const g=await dbAll('goals');return g.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(g=>({...g,smart:{specific:g.smart_specific||'',measurable:g.smart_measurable||'',achievable:g.smart_achievable||'',relevant:g.smart_relevant||'',timeBound:g.smart_timebound||''}}))};
localHandlers['POST goals']=async(d)=>{const sm=d.smart||{};const all=await dbAll('goals');const o={category_id:Number(d.categoryId),title:d.title,goal_type:d.goalType||'habit',frequency:d.frequency||'once',target_per_period:d.targetPerPeriod||null,deadline:d.deadline||null,target_minutes:d.targetMinutes||0,progress:0,tracking_unit:d.trackingUnit||'',tracking_target:d.trackingTarget||null,tracking_direction:d.trackingDirection||'down',smart_specific:sm.specific||'',smart_measurable:sm.measurable||'',smart_achievable:sm.achievable||'',smart_relevant:sm.relevant||'',smart_timebound:sm.timeBound||'',sort_order:all.length,created_at:new Date().toISOString()};const id=await dbAdd('goals',{...o,id:undefined});return{id,status:'ok'}};
localHandlers['PUT goals/:id']=async(d,id)=>{const g=await dbGet('goals',id);if(!g)return{status:'ok'};const sm=d.smart||{};Object.assign(g,{title:d.title,category_id:Number(d.categoryId),goal_type:d.goalType||'habit',frequency:d.frequency||'once',target_per_period:d.targetPerPeriod||null,deadline:d.deadline||null,target_minutes:d.targetMinutes||0,progress:d.progress||g.progress||0,tracking_unit:d.trackingUnit||'',tracking_target:d.trackingTarget||null,tracking_direction:d.trackingDirection||'down',smart_specific:sm.specific||'',smart_measurable:sm.measurable||'',smart_achievable:sm.achievable||'',smart_relevant:sm.relevant||'',smart_timebound:sm.timeBound||''});await dbPut('goals',g);return{status:'ok'}};
localHandlers['POST goals/:id/toggle']=async(_,id)=>{const g=await dbGet('goals',id);if(g){g.progress=g.progress>=100?0:100;await dbPut('goals',g)}return{status:'ok'}};
localHandlers['DELETE goals/:id']=async(_,id)=>{await dbDel('goals',Number(id));return{status:'ok'}};
// --- Entries ---
localHandlers['GET entries']=async()=>{const e=await dbAll('entries');return e.sort((a,b)=>b.entry_date.localeCompare(a.entry_date)||(b.created_at||'').localeCompare(a.created_at||''))};
localHandlers['POST entries']=async(d)=>{const date=d.entryDate||today();const endDate=d.endDate||date;let mins=d.minutes||0;if(d.startTime&&d.endTime&&!mins){const s=new Date(date+'T'+d.startTime);const e=new Date(endDate+'T'+d.endTime);if(e>s)mins=Math.round((e-s)/60000)}const o={category_id:Number(d.categoryId),goal_id:d.goalId?Number(d.goalId):null,label:d.label||'',minutes:Math.round(mins),start_time:d.startTime||null,end_time:d.endTime||null,note:d.note||'',entry_date:date,end_date:endDate!==date?endDate:null,created_at:new Date().toISOString()};const id=await dbAdd('entries',{...o,id:undefined});return{id,status:'ok'}};
localHandlers['PUT entries/:id']=async(d,id)=>{const e=await dbGet('entries',id);if(!e)return{status:'ok'};const date=d.entryDate||today();const endDate=d.endDate||date;let mins=d.minutes||0;if(d.startTime&&d.endTime&&!mins){const s=new Date(date+'T'+d.startTime);const en=new Date(endDate+'T'+d.endTime);if(en>s)mins=Math.round((en-s)/60000)}Object.assign(e,{category_id:Number(d.categoryId),goal_id:d.goalId?Number(d.goalId):null,label:d.label||'',minutes:Math.round(mins),start_time:d.startTime||null,end_time:d.endTime||null,note:d.note||'',entry_date:date,end_date:endDate!==date?endDate:null});await dbPut('entries',e);return{status:'ok'}};
localHandlers['DELETE entries/:id']=async(_,id)=>{await dbDel('entries',Number(id));return{status:'ok'}};
localHandlers['POST entries/bulk-delete']=async(d)=>{for(const id of(d.ids||[]))await dbDel('entries',Number(id));return{status:'ok'}};
// --- Labels ---
localHandlers['GET labels']=async()=>{const entries=await dbAll('entries');const m={};entries.filter(e=>e.label).forEach(e=>{const k=e.category_id+'|'+e.label;if(!m[k])m[k]={category_id:e.category_id,label:e.label,cnt:0,total_mins:0};m[k].cnt++;m[k].total_mins+=e.minutes||0});return Object.values(m).sort((a,b)=>a.category_id-b.category_id||b.cnt-a.cnt)};
// --- Settings ---
localHandlers['GET settings']=async()=>{const s=await dbAll('settings');const r={};s.forEach(x=>r[x.key]=x.value);return r};
localHandlers['PUT settings']=async(d)=>{const all=await dbAll('settings');const ex=all.find(s=>s.key===d.key);if(ex){ex.value=d.value;await dbPut('settings',ex)}else{await dbAdd('settings',{key:d.key,value:d.value})}return{status:'ok'}};
// --- Habits ---
localHandlers['POST habits/log']=async(d)=>{const date=d.logDate||today();const all=await dbAll('habit_logs');const ex=all.find(h=>h.goal_id==d.goalId&&h.log_date===date);if(ex){ex.done=d.done?1:0;if(d.note)ex.note=d.note;await dbPut('habit_logs',ex)}else{await dbAdd('habit_logs',{goal_id:Number(d.goalId),log_date:date,done:d.done?1:0,note:d.note||''})}return{status:'ok'}};
localHandlers['POST habits/note']=async(d)=>{const date=d.logDate||today();const all=await dbAll('habit_logs');const ex=all.find(h=>h.goal_id==d.goalId&&h.log_date===date);if(ex){ex.note=d.note||'';await dbPut('habit_logs',ex)}else{await dbAdd('habit_logs',{goal_id:Number(d.goalId),log_date:date,done:0,note:d.note||''})}return{status:'ok'}};
// --- Dashboard ---
localHandlers['GET dashboard']=async(_,__,params)=>{const dt=params.get('date')||today();const goals=await dbAll('goals');const cats=await dbAll('categories');const hlogs=await dbAll('habit_logs');const entries=await dbAll('entries');const catMap={};cats.forEach(c=>catMap[c.id]=c.name);const d30=new Date();d30.setDate(d30.getDate()-30);const d30s=d30.toISOString().slice(0,10);const ws=getMonday(dt);const we=getSunday(dt);const ms=dt.slice(0,7)+'-01';
const result=goals.filter(g=>g.progress<100).map(g=>{const ghl=hlogs.filter(h=>h.goal_id===g.id);const doneToday=ghl.filter(h=>h.log_date===dt&&h.done).length;const todayLog=ghl.find(h=>h.log_date===dt);const s30=ghl.filter(h=>h.done&&h.log_date>=d30s).length;const doneWeek=ghl.filter(h=>h.done&&h.log_date>=ws&&h.log_date<=we).length;const doneMonth=ghl.filter(h=>h.done&&h.log_date>=ms).length;const ge=entries.filter(e=>e.goal_id===g.id);const minsWeek=ge.filter(e=>e.entry_date>=ws&&e.entry_date<=we).reduce((s,e)=>s+(e.minutes||0),0);const minsMonth=ge.filter(e=>e.entry_date>=ms).reduce((s,e)=>s+(e.minutes||0),0);return{...g,cat_name:catMap[g.category_id]||'',done_today:doneToday,today_note:todayLog?.note||null,streak_30d:s30,done_this_week:doneWeek,done_this_month:doneMonth,mins_this_week:minsWeek,mins_this_month:minsMonth,smart:{specific:g.smart_specific||'',measurable:g.smart_measurable||'',achievable:g.smart_achievable||'',relevant:g.smart_relevant||'',timeBound:g.smart_timebound||''}}}).sort((a,b)=>{const fo=['daily','weekly','monthly','yearly','once'];return fo.indexOf(a.frequency)-fo.indexOf(b.frequency)||a.title.localeCompare(b.title)});
// Streak
const uniqueDates=[...new Set(hlogs.filter(h=>h.done).map(h=>h.log_date))].sort().reverse();let streak=0,checkDate=dt;for(const d of uniqueDates){if(d===checkDate){streak++;const cd=new Date(checkDate+'T12:00:00');cd.setDate(cd.getDate()-1);checkDate=cd.toISOString().slice(0,10)}else if(d<checkDate)break}
return{goals:result,streak,today:dt}};
// --- Tracking ---
localHandlers['GET goals/:id/tracking']=async(_,id)=>{const all=await dbAll('tracking_entries');return all.filter(t=>t.goal_id==id).sort((a,b)=>b.entry_date.localeCompare(a.entry_date))};
localHandlers['POST goals/:id/tracking']=async(d,id)=>{id=Number(id);const eid=await dbAdd('tracking_entries',{goal_id:id,value:d.value,note:d.note||'',entry_date:d.entryDate||today(),created_at:new Date().toISOString()});return{id:eid,status:'ok'}};
localHandlers['DELETE tracking/:id']=async(_,id)=>{await dbDel('tracking_entries',Number(id));return{status:'ok'}};
// --- Life Values & Matrix ---
localHandlers['GET life-values']=async()=>(await dbAll('life_values')).sort((a,b)=>(b.importance||0)-(a.importance||0));
localHandlers['POST life-values']=async(d)=>{const id=await dbAdd('life_values',{category_id:d.categoryId?Number(d.categoryId):null,area_name:d.areaName,importance:d.importance||5,satisfaction:d.satisfaction||5,ideal_hours_week:d.idealHoursWeek||0});return{id,status:'ok'}};
localHandlers['PUT life-values/:id']=async(d,id)=>{const v=await dbGet('life_values',id);if(v){Object.assign(v,{category_id:d.categoryId?Number(d.categoryId):null,area_name:d.areaName,importance:d.importance||5,satisfaction:d.satisfaction||5,ideal_hours_week:d.idealHoursWeek||0});await dbPut('life_values',v)}return{status:'ok'}};
localHandlers['DELETE life-values/:id']=async(_,id)=>{await dbDel('life_values',Number(id));return{status:'ok'}};
localHandlers['GET life-matrix']=async()=>{const vals=await dbAll('life_values');const cats=await dbAll('categories');const entries=await dbAll('entries');const d28=new Date();d28.setDate(d28.getDate()-28);const d28s=d28.toISOString().slice(0,10);const catMap={};cats.forEach(c=>catMap[c.id]=c.name);const actuals={};entries.filter(e=>e.entry_date>=d28s).forEach(e=>{if(!actuals[e.category_id])actuals[e.category_id]={mins:0};actuals[e.category_id].mins+=e.minutes||0});const totalImp=vals.reduce((s,v)=>s+(v.importance||0),0);const totalHpw=Object.values(actuals).reduce((s,a)=>s+a.mins/60/4,0);const matrix=vals.map(v=>{const ahpw=v.category_id&&actuals[v.category_id]?actuals[v.category_id].mins/60/4:0;const ipct=totalImp>0?Math.round(v.importance/totalImp*100):0;const tpct=totalHpw>0?Math.round(ahpw/totalHpw*100):0;return{id:v.id,area_name:v.area_name,cat_name:catMap[v.category_id]||'',importance:v.importance,satisfaction:v.satisfaction,ideal_hours_week:v.ideal_hours_week,actual_hours_week:Math.round(ahpw*10)/10,importance_pct:ipct,time_pct:tpct,gap:ipct-tpct}});const tqi=matrix.length?Math.round(matrix.reduce((s,m)=>s+(100-Math.abs(m.gap)),0)/matrix.length):0;return{matrix,tqi,totalActualHours:Math.round(totalHpw*10)/10}};

// Helper functions
function getMonday(dateStr){const d=new Date(dateStr+'T12:00:00');const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);d.setDate(diff);return d.toISOString().slice(0,10)}
function getSunday(dateStr){const m=getMonday(dateStr);const d=new Date(m+'T12:00:00');d.setDate(d.getDate()+6);return d.toISOString().slice(0,10)}

// ═══════════════════════════════════════════════════════════════
// API Router - matches paths to handlers
// ═══════════════════════════════════════════════════════════════
function matchRoute(method,path){
  const key=method+' '+path;
  if(localHandlers[key])return{handler:localHandlers[key],id:null};
  // Try pattern matching
  for(const pattern in localHandlers){
    const[pm,...pparts]=pattern.split(' ');
    if(pm!==method)continue;
    const pp=pparts.join(' ');
    const regex=pp.replace(/:id/g,'(\\d+)');
    const m=path.match(new RegExp('^'+regex+'$'));
    if(m)return{handler:localHandlers[pattern],id:m[1]};
  }
  return null;
}
const api={
  get:async(ep)=>{try{const[path,qs]=ep.split('?');const params=new URLSearchParams(qs||'');const route=matchRoute('GET',path);if(route)return await route.handler(null,route.id,params);console.warn('No handler for GET',path);return{error:'Not found'}}catch(e){console.error('API GET error:',ep,e);return{error:e.message}}},
  post:async(ep,d)=>{try{const route=matchRoute('POST',ep);if(route)return await route.handler(d||{},route.id);console.warn('No handler for POST',ep);return{error:'Not found'}}catch(e){console.error('API POST error:',ep,e);return{error:e.message}}},
  put:async(ep,d)=>{try{const route=matchRoute('PUT',ep);if(route)return await route.handler(d||{},route.id);console.warn('No handler for PUT',ep);return{error:'Not found'}}catch(e){console.error('API PUT error:',ep,e);return{error:e.message}}},
  del:async(ep)=>{try{const route=matchRoute('DELETE',ep);if(route)return await route.handler(null,route.id);console.warn('No handler for DELETE',ep);return{error:'Not found'}}catch(e){console.error('API DEL error:',ep,e);return{error:e.message}}}
};

<script type="text/babel">
const{useState,useEffect,useRef}=React;
const T={bg:"#0d1117",card:"#161b22",border:"#21262d",text:"#f0f6fc",textSec:"#9ca8b6",textMuted:"#606a75",
  accent:"#e8553a",blue:"#3a8fe8",green:"#2ecc71",orange:"#f39c12",purple:"#9b59b6",teal:"#1abc9c",
  colors:["#e8553a","#3a8fe8","#2ecc71","#f39c12","#9b59b6","#1abc9c","#e74c6c","#34495e","#d35400","#27ae60"]};

const fmtMins=m=>{if(!m)return"0m";const h=Math.floor(m/60),r=m%60;return h&&r?h+"h "+r+"m":h?h+"h":r+"m"};
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString("de-CH",{weekday:"short",day:"numeric",month:"short"});
const fmtDateShort=d=>new Date(d+'T12:00:00').toLocaleDateString("de-CH",{weekday:"short",day:"numeric"});
const daysLeft=d=>Math.max(0,Math.ceil((new Date(d)-new Date())/864e5));
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const smartLabels={specific:{l:"Specific",d:"Was genau?",i:"\u{1F3AF}"},measurable:{l:"Measurable",d:"Wie messen?",i:"\u{1F4CF}"},achievable:{l:"Achievable",d:"Realistisch?",i:"\u2705"},relevant:{l:"Relevant",d:"Warum wichtig?",i:"\u{1F4A1}"},timeBound:{l:"Time-bound",d:"Bis wann?",i:"\u23F0"}};

const S={
  btn:c=>({background:c||T.accent,color:"#fff",border:"none",borderRadius:10,padding:"10px 20px",fontWeight:600,fontSize:15,cursor:"pointer",fontFamily:"inherit"}),
  btnSm:c=>({background:c||T.accent,color:"#fff",border:"none",borderRadius:8,padding:"6px 14px",fontWeight:600,fontSize:14,cursor:"pointer",fontFamily:"inherit"}),
  btnO:c=>({background:"transparent",color:c||T.textSec,border:"1px solid "+T.border,borderRadius:8,padding:"6px 14px",fontWeight:600,fontSize:14,cursor:"pointer",fontFamily:"inherit"}),
  card:{background:T.card,borderRadius:16,border:"1px solid "+T.border,padding:20},
  inp:{background:T.bg,border:"1px solid "+T.border,borderRadius:10,padding:"10px 14px",color:T.text,fontSize:15,width:"100%",boxSizing:"border-box",outline:"none",fontFamily:"inherit"},
  sel:{background:T.bg,border:"1px solid "+T.border,borderRadius:10,padding:"10px 14px",color:T.text,fontSize:15,width:"100%",boxSizing:"border-box",outline:"none",appearance:"none",cursor:"pointer",fontFamily:"inherit"},
  lbl:{fontSize:13,fontWeight:700,color:T.textSec,letterSpacing:1,marginBottom:6},
  badge:c=>({display:"inline-flex",alignItems:"center",gap:4,padding:"4px 10px",borderRadius:20,fontSize:13,fontWeight:600,background:c+"22",color:c})
};

const Bar=({pct,color,h})=><div style={{width:"100%",height:h||6,background:T.border,borderRadius:(h||6)/2,overflow:"hidden"}}><div style={{width:Math.min(100,Math.max(0,pct||0))+"%",height:"100%",background:color||T.accent,borderRadius:(h||6)/2,transition:"width .6s"}}/></div>;
const Modal=({open,onClose,title,children})=>{if(!open)return null;return<div style={{position:"fixed",inset:0,zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.7)"}} onClick={onClose}><div style={{...S.card,maxWidth:520,width:"92%",maxHeight:"85vh",overflowY:"auto",animation:"fadeIn .2s"}} onClick={e=>e.stopPropagation()}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}><h3 style={{margin:0,fontSize:18}}>{title}</h3><button onClick={onClose} style={{background:"none",border:"none",color:T.textSec,fontSize:20,cursor:"pointer"}}>&#x2715;</button></div>{children}</div></div>};
const Empty=({icon,title,sub})=><div style={{textAlign:"center",padding:"40px 20px"}}><div style={{fontSize:48,marginBottom:12}}>{icon}</div><div style={{color:T.textSec,fontWeight:600,fontSize:15,marginBottom:4}}>{title}</div><div style={{color:T.textMuted,fontSize:13}}>{sub}</div></div>;
const fmtTS=ts=>{if(!ts)return'—';const d=new Date(ts);return d.toLocaleDateString('de-CH',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})};

// ═══ Drag & Drop ═══
function useDrag(items,onReorder){
  const[dragIdx,setDI]=useState(null);const[overIdx,setOI]=useState(null);
  const onDS=(e,i)=>{setDI(i);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',i)};
  const onDO=(e,i)=>{e.preventDefault();if(i!==dragIdx)setOI(i)};
  const onDE=()=>{
    if(dragIdx!==null&&overIdx!==null&&dragIdx!==overIdx){
      const a=[...items];const[m]=a.splice(dragIdx,1);a.splice(overIdx,0,m);onReorder(a);
    }
    setDI(null);setOI(null);
  };
  return{dragIdx,overIdx,onDS,onDO,onDE};
}
const DragHandle=({onDS,idx})=><div draggable onDragStart={e=>onDS(e,idx)} style={{cursor:"grab",padding:"4px 6px",color:T.textMuted,fontSize:18,lineHeight:1,userSelect:"none",touchAction:"none"}} title="Verschieben">{"\u2261"}</div>;

function Sidebar({tab,setTab,user,onLogout,isMobile,isOpen,setIsOpen,onExport,onImport}){
  const[bkInfo,setBK]=useState(null);
  useEffect(()=>{setBK(getBackupInfo());const iv=setInterval(()=>setBK(getBackupInfo()),30000);return()=>clearInterval(iv)},[]);
  const items=[
    {k:"dash",icon:"\u{1F4CB}",label:"Dashboard",color:"#e8553a"},
    {k:"erfassung",icon:"\u23F1",label:"Erfassung",color:T.blue},
    {k:"tracking",icon:"\u{1F504}",label:"Tracking",color:T.green},
    {k:"auswertungen",icon:"\u{1F4CA}",label:"Auswertungen",color:"#e74c6c"},
    {k:"goals",icon:"\u{1F3AF}",label:"Goals",color:T.accent},
    {k:"fitness",icon:"\u{1F4AA}",label:"Fitness",color:"#e67e22"},
    {k:"weight",icon:"\u{2696}\u{FE0F}",label:"Gewicht",color:"#00b894"},
    {k:"matrix",icon:"\u{1F9ED}",label:"Life Matrix",color:T.purple},
    {k:"budget",icon:"\u{1F4B0}",label:"Budget",color:T.teal},
    {k:"lessons",icon:"\u{1F4D6}",label:"Lessons",color:"#8e44ad"},
    {k:"cats",icon:"\u{1F4C1}",label:"Kategorien",color:T.orange}
  ];
  const sw=isMobile?260:220;
  const sty=isMobile?{position:"fixed",left:isOpen?0:-sw-20,top:0,bottom:0,width:sw,zIndex:999,background:T.bg,borderRight:"1px solid "+T.border,transition:"left .3s",display:"flex",flexDirection:"column",boxShadow:isOpen?"4px 0 20px rgba(0,0,0,.5)":"none"}
    :{width:sw,flexShrink:0,background:T.bg,borderRight:"1px solid "+T.border,display:"flex",flexDirection:"column",height:"100vh"};
  return<>{isMobile&&isOpen&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:998}} onClick={()=>setIsOpen(false)}/>}
    <div style={sty}>
      <div style={{padding:"24px 20px 20px"}}><h1 style={{fontSize:22,fontWeight:700,margin:0,fontFamily:"'JetBrains Mono',monospace",background:"linear-gradient(135deg,"+T.accent+","+T.orange+")",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>TimeFlow</h1><div style={{fontSize:12,color:T.textMuted,marginTop:4}}>{"\u{1F4F1}"} Lokal</div></div>
      <div style={{flex:1,padding:"8px 12px",display:"flex",flexDirection:"column",gap:4,overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
        {items.map(it=>{const a=tab===it.k;return<button key={it.k} onClick={()=>{setTab(it.k);if(isMobile)setIsOpen(false)}} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 14px",border:"none",borderRadius:12,cursor:"pointer",fontFamily:"inherit",background:a?T.card:"transparent",color:a?T.text:T.textSec,fontSize:14,fontWeight:a?700:500,textAlign:"left",width:"100%",flexShrink:0}}>
          <span style={{fontSize:24,lineHeight:1}}>{it.icon}</span><span>{it.label}</span>{a&&<div style={{marginLeft:"auto",width:4,height:20,borderRadius:2,background:it.color}}/>}
        </button>})}
      </div>
      <div style={{padding:"12px 12px",borderTop:"1px solid "+T.border,display:"flex",flexDirection:"column",gap:4}}>
        {bkInfo&&<div style={{padding:"4px 14px",fontSize:10,color:T.green}}>
          {"\u2705"} Backup: {new Date(bkInfo.timestamp).toLocaleString('de-CH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} ({bkInfo.records} Einträge)
        </div>}
        {onExport&&<button onClick={()=>{onExport();setTimeout(()=>setBK(getBackupInfo()),1000)}} style={{display:"flex",alignItems:"center",gap:14,padding:"8px 14px",border:"none",borderRadius:12,cursor:"pointer",fontFamily:"inherit",background:"transparent",color:T.textMuted,fontSize:12,width:"100%",textAlign:"left"}}><span style={{fontSize:18}}>{"\u{1F4BE}"}</span><span>In Dateien speichern</span></button>}
        {onImport&&<button onClick={onImport} style={{display:"flex",alignItems:"center",gap:14,padding:"8px 14px",border:"none",borderRadius:12,cursor:"pointer",fontFamily:"inherit",background:"transparent",color:T.textMuted,fontSize:12,width:"100%",textAlign:"left"}}><span style={{fontSize:18}}>{"\u{1F4E5}"}</span><span>Aus Datei laden</span></button>}
      </div>
    </div></>
}

function PageHeader({title,icon,children,isMobile,setMenuOpen}){
  return<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
    <div style={{display:"flex",alignItems:"center",gap:12}}>
      {isMobile&&<button onClick={()=>setMenuOpen(true)} style={{background:"none",border:"none",color:T.textSec,fontSize:28,cursor:"pointer",padding:0}}>{"\u2630"}</button>}
      <span style={{fontSize:32}}>{icon}</span><h2 style={{margin:0,fontSize:22,fontWeight:700}}>{title}</h2>
    </div>
    <div style={{display:"flex",gap:8}}>{children}</div>
  </div>
}

function TrackingPanel({goal,loadData}){
  const[entries,setE]=useState([]);const[v,setV]=useState("");const[n,setN]=useState("");
  const load=async()=>{const d=await api.get('goals/'+goal.id+'/tracking');setE(Array.isArray(d)?d:[])};
  useEffect(()=>{load()},[goal.id]);
  const add=async()=>{if(!v)return;const r=await api.post('goals/'+goal.id+'/tracking',{value:parseFloat(v),note:n.trim()});if(!r.error){setV("");setN("");load();loadData()}};
  const latest=entries[0];const trend=entries.length>=2?entries[0].value-entries[1].value:0;
  return<div style={{marginTop:12,padding:14,background:T.bg,borderRadius:12}}>
    <div style={{...S.lbl,marginBottom:8}}>TRACKING {goal.tracking_unit?'('+goal.tracking_unit+')':''}</div>
    {latest&&<div style={{display:"flex",gap:12,marginBottom:12}}>
      <div style={{textAlign:"center",flex:1}}><div style={{fontSize:24,fontWeight:700,color:T.text}}>{latest.value}</div><div style={{fontSize:11,color:T.textSec}}>Aktuell</div></div>
      {goal.tracking_target&&<div style={{textAlign:"center",flex:1}}><div style={{fontSize:24,fontWeight:700,color:T.green}}>{goal.tracking_target}</div><div style={{fontSize:11,color:T.textSec}}>Ziel</div></div>}
      <div style={{textAlign:"center",flex:1}}><div style={{fontSize:24,fontWeight:700,color:trend>0?T.accent:trend<0?T.green:T.textSec}}>{(trend>0?"+":"")+trend.toFixed(1)}</div><div style={{fontSize:11,color:T.textSec}}>Trend</div></div>
    </div>}
    <div style={{display:"flex",gap:6,marginBottom:8}}>
      <input type="number" step="0.1" style={{...S.inp,fontSize:12,padding:"6px 10px",flex:1}} value={v} onChange={e=>setV(e.target.value)} placeholder="Wert" onKeyDown={e=>e.key==='Enter'&&add()}/>
      <input style={{...S.inp,fontSize:12,padding:"6px 10px",flex:1}} value={n} onChange={e=>setN(e.target.value)} placeholder="Notiz..."/>
      <button onClick={add} style={S.btnSm(T.teal)}>+</button>
    </div>
    {entries.slice(0,5).map(e=><div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",fontSize:12,borderBottom:"1px solid "+T.border}}>
      <span style={{color:T.textSec}}>{fmtDate(e.entry_date)}</span><span style={{fontWeight:700}}>{e.value} {goal.tracking_unit}</span>
      <button onClick={async()=>{await api.del('tracking/'+e.id);load();loadData()}} style={{background:"none",border:"none",color:T.textMuted,cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>&#x2715;</button>
    </div>)}
  </div>
}

/* ============ TIMER ============ */
function Timer({onStop}){
  const[sec,setSec]=useState(0);const startRef=useRef(new Date());const intRef=useRef(null);
  useEffect(()=>{intRef.current=setInterval(()=>setSec(Math.floor((new Date()-startRef.current)/1000)),1000);return()=>clearInterval(intRef.current)},[]);
  const stop=()=>{clearInterval(intRef.current);onStop({minutes:Math.max(1,Math.round(sec/60)),startTime:startRef.current.toTimeString().slice(0,5),endTime:new Date().toTimeString().slice(0,5)})};
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return<div style={{...S.card,textAlign:"center",borderColor:T.accent}}>
    <div style={{fontSize:11,fontWeight:700,color:T.accent,letterSpacing:2,marginBottom:8,animation:"pulse 2s infinite"}}>{"\u25CF"} TIMER</div>
    <div style={{fontSize:48,fontWeight:700,letterSpacing:2,marginBottom:12}}>{(h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}</div>
    <div style={{fontSize:12,color:T.textSec,marginBottom:16}}>Start: {startRef.current.toTimeString().slice(0,5)}</div>
    <button onClick={stop} style={{...S.btn(T.accent),width:"100%",padding:"14px",fontSize:16}}>{"\u23F9"} Stopp</button>
  </div>
}

/* ============ DASHBOARD ============ */

function DashboardTab({categories,goals,entries,catColor,catName,loadData,isMobile,setMenuOpen}){
  const[dash,setDash]=useState({goals:[],minsToday:0,budgets:[],streak:0});
  const[loading,setLoading]=useState(true);

  const load=async()=>{const d=await api.get('dashboard');if(d&&!d.error)setDash(d);setLoading(false)};
  useEffect(()=>{load()},[]);

  const allGoals=(dash.goals||[]).filter(g=>g.frequency&&g.frequency!=='once');
  const dailyDone=allGoals.filter(g=>g.frequency==='daily'&&g.done_today>0).length;
  const dailyTotal=allGoals.filter(g=>g.frequency==='daily').length;
  const today=new Date();
  const dayName=today.toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  if(loading)return<div style={{textAlign:"center",padding:40,color:T.textSec}}>Laden...</div>;

  return<div style={{animation:"fadeIn .3s"}}>
    <PageHeader title="Dashboard" icon={"\u{1F4CB}"} isMobile={isMobile} setMenuOpen={setMenuOpen}/>

    <div style={{...S.card,marginBottom:16,background:"linear-gradient(135deg,"+T.card+",#1a1f2e)"}}>
      <div style={{fontSize:13,color:T.textSec,marginBottom:4}}>{dayName}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:12}}>
        <div style={{textAlign:"center"}}><div style={{fontSize:38,fontWeight:700,color:T.accent}}>{dash.streak}</div><div style={{fontSize:10,color:T.textSec}}>Tage Streak</div></div>
        <div style={{textAlign:"center"}}><div style={{fontSize:32,fontWeight:700,color:dailyDone===dailyTotal&&dailyTotal>0?T.green:T.text}}>{dailyDone}/{dailyTotal}</div><div style={{fontSize:10,color:T.textSec}}>Habits heute</div></div>
      </div>
      {dailyTotal>0&&<div style={{marginTop:12}}><Bar pct={dailyTotal>0?Math.round(dailyDone/dailyTotal*100):0} color={dailyDone===dailyTotal?T.green:T.accent} h={4}/></div>}
    </div>

    {/* Per-Goal Streaks grouped by Category */}
    {allGoals.length>0&&(()=>{
      const byCat={};allGoals.forEach(g=>{const k=g.category_id;if(!byCat[k])byCat[k]=[];byCat[k].push(g)});
      return Object.entries(byCat).map(([cid,goals])=>{
        const col=catColor(cid);const cn=goals[0]?.cat_name||catName(cid);
        return<div key={cid} style={{marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <div style={{width:10,height:10,borderRadius:3,background:col}}/>
            <span style={{fontWeight:700,fontSize:14}}>{cn}</span>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8}}>
            {goals.map(g=>{
              const done=g.done_today>0;const s30=parseInt(g.streak_30d)||0;
              const freq=g.frequency==='daily'?'T':g.frequency==='weekly'?'W':'M';
              return<div key={g.id} style={{...S.card,padding:"12px 14px",borderLeft:"3px solid "+col}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <span style={{fontSize:11,color:T.textSec,background:T.bg,padding:"3px 8px",borderRadius:4,fontWeight:600}}>{freq}</span>
                  {done&&<span style={{fontSize:14,color:T.green}}>{"\u2713"}</span>}
                </div>
                <div style={{fontSize:14,fontWeight:600,marginBottom:6,lineHeight:1.3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g.title}</div>
                <div style={{display:"flex",alignItems:"baseline",gap:4}}>
                  <span style={{fontSize:26,fontWeight:700,color:s30>20?T.green:s30>10?T.blue:s30>5?T.orange:T.textMuted}}>{s30}</span>
                  <span style={{fontSize:12,color:T.textSec}}>/30d</span>
                </div>
              </div>
            })}
          </div>
        </div>})
    })()}

    {allGoals.length===0&&<div style={S.card}><Empty icon={"\u{1F4CB}"} title="Dashboard leer" sub="Erstelle Goals mit Frequenz im Goals-Tab"/></div>}
  </div>
}

/* ============ GOALS ============ */
function GoalsTab({goals,categories,entries,catColor,catName,setSGM,setEG,deleteGoal,togGoal,setSEM,loadData,isMobile,setMenuOpen}){
  const[fC,setFC]=useState("all");const[fS,setFS]=useState("all");const[exG,setExG]=useState(null);const[exT,setExT]=useState(null);
  const fl=goals.filter(g=>(fC==="all"||g.category_id==fC)&&(fS==="all"||(fS==="active"&&g.progress<100)||(fS==="done"&&g.progress>=100)));
  const reorder=async(newList)=>{await api.post('reorder',{table:'goals',ids:newList.map(g=>g.id)});loadData()};
  const canDrag=fC==='all'&&fS==='all';
  const{dragIdx,overIdx,onDS,onDO,onDE}=useDrag(fl,reorder);
  return<div style={{animation:"fadeIn .3s"}}>
    <PageHeader title="Goals" icon={"\u{1F3AF}"} isMobile={isMobile} setMenuOpen={setMenuOpen}><button onClick={()=>setSGM(true)} style={S.btn()}>+ Neues Goal</button></PageHeader>
    <div style={{display:"flex",gap:8,marginBottom:16}}><select value={fC} onChange={e=>setFC(e.target.value)} style={{...S.sel,flex:1}}><option value="all">Alle Kategorien</option>{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select><select value={fS} onChange={e=>setFS(e.target.value)} style={{...S.sel,flex:1}}><option value="all">Alle</option><option value="active">Aktiv</option><option value="done">Erledigt</option></select></div>
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
    {fl.length===0?<div style={S.card}><Empty icon={"\u{1F3AF}"} title="Keine Goals" sub="Erstelle dein erstes Goal!"/></div>:fl.map((g,i)=>{
      const c=catColor(g.category_id),done=g.progress>=100,isT=g.goal_type==='tracking',dl=g.deadline?daysLeft(g.deadline):null;
      const logM=entries.filter(e=>e.goal_id==g.id).reduce((s,e)=>s+(e.minutes||0),0);
      const isDrag=dragIdx===i;const isOver=overIdx===i;
      return<div key={g.id} onDragOver={canDrag?e=>onDO(e,i):undefined} onDragEnd={canDrag?onDE:undefined} style={{...S.card,opacity:done?.6:isDrag?.4:1,borderLeft:"3px solid "+c,borderTop:isOver?"2px solid "+T.accent:undefined,transition:"opacity .2s"}}>
        <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
          {canDrag&&<DragHandle onDS={onDS} idx={i}/>}
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:6}}>
              <span style={S.badge(c)}>{catName(g.category_id)}</span>
              {isT&&<span style={S.badge(T.teal)}>{"\u{1F4CA}"} Tracking</span>}
              {g.frequency&&g.frequency!=='once'&&<span style={S.badge(freqColors[g.frequency]||T.textSec)}>{freqIcon[g.frequency]||''} {freqLabel[g.frequency]||g.frequency}</span>}
              {done&&<span style={S.badge(T.green)}>{"\u2713"}</span>}
              {dl!==null&&!done&&<span style={S.badge(dl<=3?T.accent:dl<=7?T.orange:T.textSec)}>{dl}d</span>}
            </div>
            <div style={{fontSize:17,fontWeight:700,textDecoration:done?"line-through":"none"}}>{g.title}</div>
          </div>
          <button onClick={()=>togGoal(g.id)} style={{...S.btnO(),padding:"6px 10px",fontSize:16}}>{done?"\u21A9":"\u2713"}</button>
        </div>
        <div style={{marginTop:10}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13,color:T.textSec}}>Fortschritt</span><span style={{fontSize:12,fontWeight:700,color:c}}>{g.progress}%</span></div><Bar pct={g.progress} color={c}/>
          {!isT&&g.target_minutes>0&&<div style={{fontSize:11,color:T.textMuted,marginTop:4}}>{fmtMins(logM)} / {fmtMins(g.target_minutes)}</div>}
          {isT&&g.tracking_target&&<div style={{fontSize:11,color:T.textMuted,marginTop:4}}>Ziel: {g.tracking_target} {g.tracking_unit}</div>}
        </div>
        <div style={{display:"flex",gap:6,marginTop:12,flexWrap:"wrap"}}>
          {!isT&&<button onClick={()=>setSEM(true)} style={S.btnSm(T.blue)}>+ Zeit</button>}
          {isT&&<button onClick={()=>setExT(exT===g.id?null:g.id)} style={S.btnSm(T.teal)}>{exT===g.id?"\u25B2":"\u25BC"} Track</button>}
          <button onClick={()=>setExG(exG===g.id?null:g.id)} style={S.btnO()}>SMART</button>
          <button onClick={()=>{setEG(g);setSGM(true)}} style={S.btnO()}>{"\u270E"}</button>
          <button onClick={()=>{if(confirm("Löschen?"))deleteGoal(g.id)}} style={S.btnO(T.accent)}>{"\u2715"}</button>
        </div>
        {exT===g.id&&<TrackingPanel goal={g} loadData={loadData}/>}
        {exG===g.id&&g.smart&&<div style={{marginTop:14,padding:14,background:T.bg,borderRadius:12,display:"flex",flexDirection:"column",gap:10}}>{Object.entries(smartLabels).map(([k,m])=>g.smart[k]?<div key={k} style={{display:"flex",gap:10}}><span style={{fontSize:18}}>{m.i}</span><div><div style={{fontSize:11,fontWeight:700,color:T.textSec}}>{m.l}</div><div style={{fontSize:13,lineHeight:1.5}}>{g.smart[k]}</div></div></div>:null)}</div>}
      </div>})}
    </div>
  </div>
}

/* ============ ERFASSUNG ============ */
function ErfassungTab({entries,categories,labels,catColor,catName,setSEM,setEditEntry,deleteEntry,loadData,isMobile,setMenuOpen}){
  const td=new Date().toISOString().slice(0,10);
  const[blocks,setBlocks]=useState([]);const[showAdd,setShowAdd]=useState(false);
  const[bC,setBC]=useState("");const[bL,setBL]=useState("");const[bS,setBS]=useState("");const[bE,setBE]=useState("");
  const[selDate,setSD]=useState(td);const[editBlock,setEB]=useState(null);
  const[filterCat,setFC]=useState("all");const[logging,setLog]=useState(null);
  const[sel,setSel]=useState(new Set());

  const loadBlocks=async()=>{const r=await api.get('settings');if(r&&!r.error&&r.time_blocks)try{
    let bl=JSON.parse(r.time_blocks);
    // Migrate old name→label
    let changed=false;bl=bl.map(b=>{if(b.name&&!b.label){changed=true;return{...b,label:b.name,name:undefined}}return b});
    if(changed)await api.put('settings',{key:'time_blocks',value:JSON.stringify(bl)});
    setBlocks(bl);
  }catch(e){}};
  useEffect(()=>{loadBlocks()},[]);
  const saveBlocks=async(newB)=>{setBlocks(newB);await api.put('settings',{key:'time_blocks',value:JSON.stringify(newB)})};

  const addBlock=()=>{
    if(!bL.trim()||!bC)return;
    const b={label:bL.trim(),categoryId:parseInt(bC),startTime:bS||null,endTime:bE||null};
    if(editBlock!==null){const nb=[...blocks];nb[editBlock]=b;saveBlocks(nb)}
    else saveBlocks([...blocks,b]);
    setBL("");setBC("");setBS("");setBE("");setShowAdd(false);setEB(null);
  };
  const delBlock=i=>{if(confirm('Löschen?')){const nb=blocks.filter((_,j)=>j!==i);saveBlocks(nb)}};
  const editB=(i,e)=>{e.stopPropagation();const b=blocks[i];setBL(b.label||b.name||"");setBC(String(b.categoryId));setBS(b.startTime||"");setBE(b.endTime||"");setEB(i);setShowAdd(true)};

  const logBlock=async(b,i)=>{
    setLog(i);
    const lbl=b.label||b.name||'';
    const data={categoryId:b.categoryId,goalId:null,label:lbl,startTime:b.startTime||null,endTime:b.endTime||null,note:'',entryDate:selDate,endDate:selDate,minutes:0};
    if(b.startTime&&b.endTime){
      let s=new Date(selDate+'T'+b.startTime);let e=new Date(selDate+'T'+b.endTime);
      if(e<=s){e.setDate(e.getDate()+1);data.endDate=e.toISOString().slice(0,10)}
      data.minutes=Math.round((e-s)/60000);
    }
    await api.post('entries',data);
    setLog('done-'+i);setTimeout(()=>setLog(null),800);loadData();
  };

  const toggleSel=id=>{const n=new Set(sel);if(n.has(id))n.delete(id);else n.add(id);setSel(n)};
  const bulkDel=async()=>{if(!sel.size||!confirm(sel.size+' Einträge löschen?'))return;await api.post('entries/bulk-delete',{ids:[...sel]});setSel(new Set());loadData()};

  const sorted=[...entries].sort((a,b)=>b.entry_date.localeCompare(a.entry_date)||((b.start_time||'').localeCompare(a.start_time||'')));
  const grouped={};sorted.forEach(e=>{const d=e.entry_date;if(!grouped[d])grouped[d]=[];grouped[d].push(e)});
  const prevDay=()=>{const d=new Date(selDate+'T12:00:00');d.setDate(d.getDate()-1);setSD(d.toISOString().slice(0,10))};
  const nextDay=()=>{const d=new Date(selDate+'T12:00:00');d.setDate(d.getDate()+1);if(d.toISOString().slice(0,10)<=td)setSD(d.toISOString().slice(0,10))};
  const isToday=selDate===td;
  const isYesterday=(()=>{const y=new Date();y.setDate(y.getDate()-1);return selDate===y.toISOString().slice(0,10)})();
  const dateLbl=isToday?"Heute":isYesterday?"Gestern":new Date(selDate+'T12:00:00').toLocaleDateString('de-CH',{weekday:'short',day:'numeric',month:'short'});

  // Group blocks by category for display
  const catBlocks={};blocks.forEach((b,i)=>{const k=b.categoryId;if(!catBlocks[k])catBlocks[k]=[];catBlocks[k].push({...b,idx:i})});
  const catIds=filterCat==="all"?Object.keys(catBlocks):[filterCat];
  const blockCats=[...new Set(blocks.map(b=>b.categoryId))];

  return<div style={{animation:"fadeIn .3s"}}>
    <PageHeader title="Erfassung" icon={"\u23F1"} isMobile={isMobile} setMenuOpen={setMenuOpen}/>

    {/* Date nav */}
    <div style={{...S.card,display:"flex",alignItems:"center",gap:8,padding:"10px 16px",marginBottom:16}}>
      <button onClick={prevDay} style={{background:"none",border:"none",color:T.textSec,fontSize:22,cursor:"pointer",padding:"4px 8px"}}>{"\u25C0"}</button>
      <div style={{flex:1,textAlign:"center"}}>
        <div style={{fontSize:18,fontWeight:700,color:isToday?T.green:isYesterday?T.orange:T.text}}>{dateLbl}</div>
        {!isToday&&<div style={{fontSize:13,color:T.textMuted}}>{selDate}</div>}
      </div>
      <button onClick={nextDay} disabled={isToday} style={{background:"none",border:"none",color:isToday?T.border:T.textSec,fontSize:22,cursor:isToday?"default":"pointer",padding:"4px 8px"}}>{"\u25B6"}</button>
      {!isToday&&<button onClick={()=>setSD(td)} style={{...S.btnSm(T.green),padding:"4px 10px",fontSize:12}}>Heute</button>}
      <button onClick={()=>{setEditEntry(null);setSEM(true)}} style={{...S.btnO(T.blue),padding:"6px 12px"}}>+ Manuell</button>
    </div>

    {/* BAUSTEINE */}
    <div style={{marginBottom:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{fontWeight:700,fontSize:14}}>{"\u{1F9F1}"} Bausteine</span>
        <button onClick={()=>{setEB(null);setBL("");setBC(categories[0]?.id?String(categories[0].id):"");setBS("");setBE("");setShowAdd(!showAdd)}} style={S.btnSm(T.blue)}>{showAdd?"\u2715":"+"}</button>
      </div>

      {showAdd&&<div style={{...S.card,marginBottom:12,padding:14}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <div><div style={S.lbl}>KATEGORIE</div><select style={S.sel} value={bC} onChange={e=>setBC(e.target.value)}>{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
          <div><div style={S.lbl}>LABEL *</div><input style={S.inp} value={bL} onChange={e=>setBL(e.target.value)} placeholder="z.B. Arbeit, Pendeln..." autoFocus/></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <div><div style={S.lbl}>VON</div><input type="time" style={S.inp} value={bS} onChange={e=>setBS(e.target.value)}/></div>
          <div><div style={S.lbl}>BIS</div><input type="time" style={S.inp} value={bE} onChange={e=>setBE(e.target.value)}/></div>
        </div>
        <button onClick={addBlock} disabled={!bL.trim()||!bC} style={{...S.btn(T.green),opacity:bL.trim()&&bC?1:.4,width:"100%"}}>{editBlock!==null?"Speichern":"Erstellen"}</button>
      </div>}

      {blocks.length===0&&!showAdd&&<div style={{...S.card,padding:"16px 20px",textAlign:"center",color:T.textSec,fontSize:13}}>Erstelle Bausteine für schnelles Loggen</div>}

      {/* Category filter tabs */}
      {blockCats.length>1&&<div style={{display:"flex",gap:4,marginBottom:10,flexWrap:"wrap"}}>
        <button onClick={()=>setFC("all")} style={{...(filterCat==="all"?S.btnSm(T.blue):S.btnO(T.textSec)),fontSize:12,padding:"5px 12px"}}>Alle</button>
        {blockCats.map(cid=><button key={cid} onClick={()=>setFC(String(cid))} style={{...(filterCat===String(cid)?S.btnSm(catColor(cid)):S.btnO(catColor(cid))),fontSize:12,padding:"5px 12px"}}>{catName(cid)}</button>)}
      </div>}

      {/* Blocks grouped by category */}
      {catIds.map(cid=>{const bs=catBlocks[cid];if(!bs)return null;const col=catColor(cid);
        return<div key={cid} style={{marginBottom:12}}>
          {filterCat==="all"&&<div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
            <div style={{width:8,height:8,borderRadius:2,background:col}}/>
            <span style={{fontSize:15,fontWeight:700,color:T.textSec}}>{catName(cid)}</span>
          </div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:6}}>
            {bs.map(b=>{
              const dur=b.startTime&&b.endTime?(()=>{let s=new Date('2000-01-01T'+b.startTime);let e=new Date('2000-01-01T'+b.endTime);if(e<=s)e.setDate(e.getDate()+1);return fmtMins(Math.round((e-s)/60000))})():null;
              const isL=logging===b.idx;const isDone=logging==='done-'+b.idx;
              return<div key={b.idx} style={{background:isDone?T.green+"18":T.card,border:"1px solid "+(isDone?T.green:T.border),borderLeft:"4px solid "+(isDone?T.green:col),borderRadius:10,padding:"10px 12px",cursor:isL?"wait":"pointer",opacity:isL?.5:1,transition:"all .3s"}} onClick={()=>!isL&&!isDone&&logBlock(b,b.idx)}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontWeight:700,fontSize:15}}>{b.label||b.name}</span>
                  {isDone&&<span style={{color:T.green,fontSize:16}}>{"\u2713"}</span>}
                </div>
                {b.startTime&&b.endTime&&<div style={{fontSize:14,color:isDone?T.green:T.blue,marginTop:2}}>{b.startTime}–{b.endTime} · {dur}</div>}
                {!isDone&&<div style={{display:"flex",justifyContent:"flex-end",gap:4,marginTop:4}} onClick={e=>e.stopPropagation()}>
                  <button onClick={e=>editB(b.idx,e)} style={{background:"none",border:"none",color:T.textMuted,cursor:"pointer",fontSize:10,padding:2}}>{"\u270E"}</button>
                  <button onClick={e=>{e.stopPropagation();delBlock(b.idx)}} style={{background:"none",border:"none",color:T.textMuted,cursor:"pointer",fontSize:10,padding:2}}>{"\u2715"}</button>
                </div>}
              </div>
            })}
          </div>
        </div>})}
    </div>

    {/* Bulk actions bar */}
    {sel.size>0&&<div style={{...S.card,padding:"10px 16px",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between",border:"1px solid "+T.accent}}>
      <span style={{fontSize:14,fontWeight:700}}>{sel.size} ausgewählt</span>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setSel(new Set())} style={S.btnO(T.textSec)}>Abbrechen</button>
        <button onClick={bulkDel} style={S.btn(T.accent)}>Löschen</button>
      </div>
    </div>}

    {/* Entry list */}
    {sorted.length===0?<div style={S.card}><Empty icon={"\u23F1"} title="Keine Einträge" sub="Tippe auf einen Baustein"/></div>
    :Object.entries(grouped).map(([d,de])=>{
      const dt=de.reduce((s,e)=>s+(e.minutes||0),0);
      const allSel=de.every(e=>sel.has(e.id));
      const toggleAll=()=>{const n=new Set(sel);if(allSel)de.forEach(e=>n.delete(e.id));else de.forEach(e=>n.add(e.id));setSel(n)};
      return<div key={d} style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",marginBottom:6,borderBottom:"1px solid "+T.border}}>
          <input type="checkbox" checked={allSel} onChange={toggleAll} style={{width:16,height:16,accentColor:T.accent,cursor:"pointer"}}/>
          <span style={{fontSize:15,fontWeight:700,flex:1}}>{fmtDate(d)}</span>
          <span style={{fontSize:14,fontWeight:700,color:T.accent}}>{fmtMins(dt)}</span>
        </div>
        {de.map(e=>{const col=catColor(e.category_id);const isSel=sel.has(e.id);
          const sameDay=!e.end_date||e.end_date===e.entry_date;
          const ts=e.start_time&&e.end_time?(sameDay?e.start_time.slice(0,5)+'–'+e.end_time.slice(0,5):e.start_time.slice(0,5)+' → '+fmtDate(e.end_date)+' '+e.end_time.slice(0,5)):null;
          return<div key={e.id} style={{background:isSel?T.accent+"12":T.card,border:"1px solid "+(isSel?T.accent:T.border),borderLeft:"4px solid "+col,borderRadius:10,padding:"8px 12px",marginBottom:3,display:"flex",alignItems:"center",gap:10}}>
            <input type="checkbox" checked={isSel} onChange={()=>toggleSel(e.id)} style={{width:16,height:16,accentColor:T.accent,cursor:"pointer",flexShrink:0}}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                {e.label&&<span style={{fontSize:15,fontWeight:700,color:T.text}}>{e.label}</span>}
                <span style={{fontSize:13,color:col,fontWeight:600}}>{catName(e.category_id)}</span>
                <span style={{fontWeight:600,fontSize:14,color:T.textSec}}>{fmtMins(e.minutes)}</span>
              </div>
              {ts&&<div style={{fontSize:13,color:T.blue,marginTop:1,fontVariantNumeric:"tabular-nums"}}>{ts}</div>}
              {e.note&&<div style={{fontSize:12,color:T.textMuted,marginTop:1}}>{e.note}</div>}
            </div>
            <button onClick={()=>{setEditEntry(e);setSEM(true)}} style={{background:"none",border:"none",color:T.textMuted,cursor:"pointer",fontSize:13,padding:4}}>{"\u270E"}</button>
          </div>})}
      </div>})}
  </div>
}

/* ============ TRACKING ============ */
function TrackingTab({catColor,catName,loadData,isMobile,setMenuOpen}){
  const todayStr=new Date().toISOString().slice(0,10);
  const yesterdayStr=new Date(Date.now()-864e5).toISOString().slice(0,10);
  const[dash,setDash]=useState({goals:[]});const[sub,setSub]=useState("daily");
  const[selDate,setSelDate]=useState(todayStr);
  const[habitNote,setHN]=useState({});const[showNote,setSN]=useState({});

  const load=async()=>{const res=await api.get('dashboard?date='+selDate);if(res&&!res.error)setDash(res)};
  useEffect(()=>{load();setHN({});setSN({})},[selDate]);

  const logHabit=async(goalId,done,note)=>{
    await api.post('habits/log',{goalId,done:done?1:0,note:note||'',logDate:selDate});load();loadData();
  };
  const saveNote=async(goalId,note)=>{
    await api.post('habits/note',{goalId,note:note||'',logDate:selDate});load();
  };

  const isToday=selDate===todayStr;const isYesterday=selDate===yesterdayStr;
  const dateLbl=isToday?"Heute":isYesterday?"Gestern":new Date(selDate+'T12:00:00').toLocaleDateString('de-CH',{weekday:'short',day:'numeric',month:'short'});

  const grouped={daily:[],weekly:[],monthly:[]};
  (dash.goals||[]).forEach(g=>{if(grouped[g.frequency])grouped[g.frequency].push(g)});
  const list=grouped[sub]||[];

  const subs=[{k:"daily",l:"\u{1F504} Täglich",count:grouped.daily.length},{k:"weekly",l:"\u{1F4C5} Wöchentlich",count:grouped.weekly.length},{k:"monthly",l:"\u{1F4C6} Monatlich",count:grouped.monthly.length}];

  const prevDay=()=>{const d=new Date(selDate+'T12:00:00');d.setDate(d.getDate()-1);setSelDate(d.toISOString().slice(0,10))};
  const nextDay=()=>{const d=new Date(selDate+'T12:00:00');d.setDate(d.getDate()+1);const n=d.toISOString().slice(0,10);if(n<=todayStr)setSelDate(n)};

  return<div style={{animation:"fadeIn .3s"}}>
    <PageHeader title="Tracking" icon={"\u{1F504}"} isMobile={isMobile} setMenuOpen={setMenuOpen}/>

    {/* Date Navigation */}
    <div style={{...S.card,padding:"10px 16px",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <button onClick={prevDay} style={{...S.btnO(),padding:"6px 12px",fontSize:18}}>{"\u25C0"}</button>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:18,fontWeight:700,color:isToday?T.green:isYesterday?T.orange:T.text}}>{dateLbl}</div>
          {!isToday&&!isYesterday&&<div style={{fontSize:10,color:T.textSec}}>{selDate}</div>}
        </div>
        {!isToday&&<button onClick={()=>setSelDate(todayStr)} style={{...S.btnSm(T.green),fontSize:10,padding:"4px 10px"}}>Heute</button>}
      </div>
      <button onClick={nextDay} disabled={isToday} style={{...S.btnO(),padding:"6px 12px",fontSize:18,opacity:isToday?.3:1}}>{"\u25B6"}</button>
    </div>

    <div style={{display:"flex",gap:6,marginBottom:16}}>
      {subs.map(s=><button key={s.k} onClick={()=>setSub(s.k)} style={{...(sub===s.k?S.btn(T.green):S.btnO(T.green)),fontSize:12,flex:1}}>{s.l} ({s.count})</button>)}
    </div>

    {list.length===0&&<div style={S.card}><Empty icon={"\u{1F504}"} title={"Keine Goals"} sub="Erstelle Goals mit der passenden Frequenz im Goals-Tab"/></div>}

    {/* DAILY */}
    {sub==="daily"&&list.map(g=>{
      const done=g.done_today>0;const col=catColor(g.category_id);const s30=parseInt(g.streak_30d)||0;
      const hasNote=g.today_note||habitNote[g.id];
      return<div key={g.id} style={{marginBottom:10}}>
        <div onClick={()=>{if(!done)logHabit(g.id,true,'');else logHabit(g.id,false,'')}} style={{...S.card,padding:"14px 18px",borderLeft:"4px solid "+(done?T.green:col),cursor:"pointer",background:done?T.green+"08":T.card}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:44,height:44,borderRadius:12,border:"2.5px solid "+(done?T.green:T.border),background:done?T.green+"22":"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:T.green,fontSize:22,flexShrink:0}}>{done?"\u2713":""}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:15,color:done?T.green:T.text,textDecoration:done?"line-through":"none"}}>{g.title}</div>
              <div style={{fontSize:11,color:T.textSec,marginTop:2}}>{g.cat_name}{g.target_per_period?' · Ziel: '+g.target_per_period+(g.tracking_unit?' '+g.tracking_unit:'')+'/Tag':''}</div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:22,fontWeight:700,color:s30>20?T.green:s30>10?T.blue:T.textMuted}}>{s30}</div>
              <div style={{fontSize:10,color:T.textMuted}}>/ 30d</div>
            </div>
          </div>
        </div>
        <div style={{display:"flex",gap:6,padding:"6px 18px 0"}}>
          <button onClick={e=>{e.stopPropagation();setSN(p=>({...p,[g.id]:!p[g.id]}));if(!showNote[g.id]&&g.today_note&&!habitNote[g.id])setHN(p=>({...p,[g.id]:g.today_note}))}} style={{...S.btnO(hasNote?T.blue:T.textMuted),padding:"3px 8px",fontSize:10}}>{showNote[g.id]?"\u25B2":"\u{1F4DD}"} {hasNote?"Notiz bearbeiten":"Notiz"}</button>
        </div>
        {!showNote[g.id]&&g.today_note&&<div style={{fontSize:12,color:T.textSec,padding:"4px 18px"}}>{"\u{1F4DD}"} {g.today_note}</div>}
        {showNote[g.id]&&<div style={{display:"flex",gap:6,padding:"6px 18px 0"}}>
          <input style={{...S.inp,fontSize:12,padding:"6px 10px",flex:1}} placeholder="Notiz..." value={habitNote[g.id]??g.today_note??''} onChange={e=>setHN(p=>({...p,[g.id]:e.target.value}))} onKeyDown={e=>{if(e.key==='Enter'){saveNote(g.id,habitNote[g.id]??'');setSN(p=>({...p,[g.id]:false}))}}}/>
          <button onClick={()=>{saveNote(g.id,habitNote[g.id]??'');setSN(p=>({...p,[g.id]:false}))}} style={S.btnSm(T.blue)}>{"\u{1F4BE}"}</button>
        </div>}
      </div>
    })}

    {/* WEEKLY */}
    {sub==="weekly"&&list.map(g=>{
      const col=catColor(g.category_id);const done=g.done_today>0;
      const doneW=parseInt(g.done_this_week)||0;const minsW=parseInt(g.mins_this_week)||0;
      const target=g.target_per_period?parseFloat(g.target_per_period):7;
      const pct=g.goal_type==='time'&&g.target_minutes?Math.min(100,Math.round(minsW/g.target_minutes*100)):Math.min(100,Math.round(doneW/target*100));
      return<div key={g.id} style={{...S.card,padding:"14px 18px",marginBottom:10,borderLeft:"4px solid "+col}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
          <button onClick={()=>logHabit(g.id,!done,'')} style={{width:40,height:40,borderRadius:10,border:"2.5px solid "+(done?T.green:T.border),background:done?T.green+"22":"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:T.green,fontSize:18,flexShrink:0,fontFamily:"inherit"}}>{done?"\u2713":"+"}</button>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:15}}>{g.title}</div>

/* ============ STATS ============ */
function StatsTab({catStats,catColor,goals,entries,weekData,isMobile,setMenuOpen}){
  const totalMins=entries.reduce((s,e)=>s+(e.minutes||0),0);
  const dG=goals.filter(g=>g.progress>=100).length;
  const uD=new Set(entries.map(e=>e.entry_date)).size;const avg=uD>0?Math.round(totalMins/uD):0;
  const last7=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);last7.push(d.toISOString().slice(0,10))}
  const maxD=Math.max(1,...last7.map(d=>(weekData||[]).filter(w=>w.entry_date===d).reduce((s,w)=>s+w.total_mins,0)));
  return<div style={{animation:"fadeIn .3s"}}>
    <PageHeader title="Statistik" icon={"\u{1F4CA}"} isMobile={isMobile} setMenuOpen={setMenuOpen}/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:16}}>
      {[{v:goals.length>0?Math.round(dG/goals.length*100)+"%":"—",l:"GOALS",c:T.green},{v:fmtMins(totalMins),l:"TOTAL",c:T.blue},{v:avg>0?fmtMins(avg):"—",l:"Ø/TAG",c:T.orange}].map(s=><div key={s.l} style={{...S.card,textAlign:"center",padding:"16px 10px"}}><div style={{fontSize:22,fontWeight:700,color:s.c}}>{s.v}</div><div style={{fontSize:10,fontWeight:700,color:T.textSec,marginTop:4}}>{s.l}</div></div>)}
    </div>
    <div style={{...S.card,marginBottom:16}}><div style={S.lbl}>WOCHENÜBERSICHT</div>
      <div style={{display:"flex",gap:4,height:140,alignItems:"flex-end",marginTop:12}}>
        {last7.map(d=>{const de=(weekData||[]).filter(w=>w.entry_date===d);const dt=de.reduce((s,w)=>s+w.total_mins,0);const bH=Math.max(2,dt/maxD*100);const isT=d===new Date().toISOString().slice(0,10);
          return<div key={d} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
            <div style={{fontSize:10,color:T.textMuted,fontWeight:600}}>{dt>0?fmtMins(dt):""}</div>
            <div style={{width:"100%",display:"flex",flexDirection:"column-reverse",height:110,gap:1}}>
              {de.length>0?de.map((w,i)=>{const sH=dt>0?w.total_mins/dt*bH:0;return<div key={i} style={{width:"100%",height:sH+"%",background:catColor(w.category_id),borderRadius:i===de.length-1?"4px 4px 0 0":0,minHeight:sH>0?2:0}}/>}):<div style={{width:"100%",height:"2%",background:T.border,borderRadius:4}}/>}
            </div>
            <div style={{fontSize:10,color:isT?T.accent:T.textSec,fontWeight:isT?700:400}}>{fmtDateShort(d)}</div>
          </div>})}
      </div>
    </div>
    <div style={S.card}><div style={S.lbl}>KATEGORIEN</div>{catStats.map(c=>{const col=catColor(c.id);const p=totalMins>0?(c.total_mins/totalMins*100).toFixed(1):"0";
      return<div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid "+T.border}}><div style={{width:12,height:12,borderRadius:4,background:col}}/><div style={{flex:1}}><div style={{fontWeight:600,fontSize:15}}>{c.name}</div><div style={{fontSize:11,color:T.textMuted}}>{c.goal_count} Goals</div></div><div style={{textAlign:"right"}}><div style={{fontWeight:700,fontSize:14,color:col}}>{fmtMins(c.total_mins)}</div><div style={{fontSize:11,color:T.textSec}}>{p}%</div></div></div>})}</div>
  </div>
}

const freqLabel={daily:"Täglich",weekly:"Wöchentlich",monthly:"Monatlich",yearly:"Jährlich",once:"Einmalig"};
const freqIcon={daily:"\u{1F504}",weekly:"\u{1F4C5}",monthly:"\u{1F4C6}",yearly:"\u{1F389}",once:"\u{1F3AF}"};
const freqColors={daily:T.accent,weekly:T.blue,monthly:T.purple,yearly:T.orange,once:T.textSec};

// Period helpers
const getWeekRange=(off)=>{const d=new Date();const day=d.getDay()||7;d.setDate(d.getDate()-day+1+(off*7));const f=new Date(d);const t=new Date(d);t.setDate(t.getDate()+6);return{from:f.toISOString().slice(0,10),to:t.toISOString().slice(0,10)}};
const getMonthRange=(off)=>{const d=new Date();d.setMonth(d.getMonth()+off,1);const f=d.toISOString().slice(0,10);const e=new Date(d.getFullYear(),d.getMonth()+1,0);return{from:f,to:e.toISOString().slice(0,10)}};
const getYearRange=(off)=>{const y=new Date().getFullYear()+off;return{from:y+'-01-01',to:y+'-12-31'}};
const getDayRange=(off)=>{const d=new Date();d.setDate(d.getDate()+off);const s=d.toISOString().slice(0,10);return{from:s,to:s}};
const getKW=(ds)=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+(w1.getDay()+6)%7)/7)};
const periodLbl=(p,from,to)=>{if(p==='day'){const d=new Date(from+'T12:00:00');return d.toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'})}if(p==='week')return'KW '+getKW(from)+' ('+fmtDateShort(from)+' – '+fmtDateShort(to)+')';if(p==='month'){const d=new Date(from+'T12:00:00');return d.toLocaleDateString('de-CH',{month:'long',year:'numeric'})}return from.slice(0,4)};
const prevLbl=(p)=>p==='day'?'Gestern':p==='week'?'Letzte Woche':p==='month'?'Letzter Monat':'Letztes Jahr';

function PeriodSelector({period,setPeriod,offset,setOffset,color}){
  const r=period==='day'?getDayRange(offset):period==='week'?getWeekRange(offset):period==='month'?getMonthRange(offset):getYearRange(offset);
  return<div style={{...S.card,padding:"12px 16px",marginBottom:16}}>
    <div style={{display:"flex",gap:5,marginBottom:10,flexWrap:"wrap"}}>
      {['day','week','month','year'].map(p=><button key={p} onClick={()=>{setPeriod(p);setOffset(0)}} style={{...period===p?S.btn(color):S.btnO(color),fontSize:11,padding:"6px 12px"}}>{p==='day'?'Tag':p==='week'?'Woche':p==='month'?'Monat':'Jahr'}</button>)}
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <button onClick={()=>setOffset(offset-1)} style={{...S.btnO(),padding:"6px 14px",fontSize:18}}>{"\u2190"}</button>
      <span style={{fontWeight:700,fontSize:14}}>{periodLbl(period,r.from,r.to)}</span>
      <button onClick={()=>setOffset(Math.min(0,offset+1))} disabled={offset>=0} style={{...S.btnO(),padding:"6px 14px",fontSize:18,opacity:offset>=0?.3:1}}>{"→"}</button>
    </div>
  </div>
}

    {goals.length===0&&<div style={S.card}><Empty icon={"\u{1F4C8}"} title="Keine Goal-Daten" sub="Erstelle Goals und tracke sie"/></div>}

/* ============ TIME STATS ============ */
function Donut({data,size}){
  const sz=size||120;const r=sz/2;const ir=r*0.6;const cx=r;const cy=r;
  const total=data.reduce((s,d)=>s+d.value,0);if(!total)return null;
  let angle=-Math.PI/2;
  const arcs=data.map(d=>{
    const pct=d.value/total;const a1=angle;const a2=angle+pct*Math.PI*2;angle=a2;
    const la=pct>0.5?1:0;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const ix1=cx+ir*Math.cos(a2),iy1=cy+ir*Math.sin(a2);
    const ix2=cx+ir*Math.cos(a1),iy2=cy+ir*Math.sin(a1);
    return{...d,pct,path:`M${x1},${y1} A${r},${r} 0 ${la} 1 ${x2},${y2} L${ix1},${iy1} A${ir},${ir} 0 ${la} 0 ${ix2},${iy2} Z`};
  });
  return<svg width={sz} height={sz} viewBox={`0 0 ${sz} ${sz}`}>
    {arcs.map((a,i)=><path key={i} d={a.path} fill={a.color} opacity={0.85}><title>{a.label}: {fmtMins(a.value)} ({Math.round(a.pct*100)}%)</title></path>)}
    <text x={cx} y={cy-6} textAnchor="middle" fill={T.text} fontSize={sz>100?18:14} fontWeight={700}>{fmtMins(total)}</text>
    <text x={cx} y={cy+12} textAnchor="middle" fill={T.textSec} fontSize={sz>100?11:9}>Total</text>
  </svg>
}

function buildTimeline(dayEntries){
  // Sort entries by start_time
  const withTime=dayEntries.filter(e=>e.start_time&&e.end_time).map(e=>{
    const sh=parseInt(e.start_time.slice(0,2)),sm=parseInt(e.start_time.slice(3,5));
    const eh=parseInt(e.end_time.slice(0,2)),em=parseInt(e.end_time.slice(3,5));
    let startM=sh*60+sm,endM=eh*60+em;
    if(endM<=startM)endM=24*60; // overnight: cap at midnight
    return{...e,startM,endM};
  }).sort((a,b)=>a.startM-b.startM);
  if(!withTime.length)return[];

  const blocks=[];
  const dayStart=withTime[0].startM;
  const dayEnd=Math.max(...withTime.map(e=>e.endM));

  let cursor=dayStart;
  withTime.forEach(e=>{
    if(e.startM>cursor){
      blocks.push({type:'gap',startM:cursor,endM:e.startM,mins:e.startM-cursor});
    }
    blocks.push({type:'entry',...e,mins:e.endM-e.startM});
    cursor=Math.max(cursor,e.endM);
  });

  return{blocks,dayStart,dayEnd,totalRange:dayEnd-dayStart};
}
