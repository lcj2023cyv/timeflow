  const prevMins=parseInt(data.prevTotal||0);
  const diff=totalMins-prevMins;
  const pctChange=prevMins>0?Math.round((diff/prevMins)*100):0;
  const catsWithData=data.byCategory.filter(c=>parseInt(c.total_mins||0)>0);

  // Donut data
  const donutData=catsWithData.map(c=>({value:parseInt(c.total_mins),color:catColor(c.id),label:c.name}));

  // Labels grouped by category
  const labelByCat={};(data.byLabel||[]).forEach(l=>{const k=l.category_id;if(!labelByCat[k])labelByCat[k]=[];labelByCat[k].push(l)});

  // Timeline for selected date
  const dayEntries=(entries||[]).filter(e=>e.entry_date===tlDate);
  const tl=buildTimeline(dayEntries);
  const fmtT=m=>{const h=Math.floor(m/60);const mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')};

  const td=new Date().toISOString().slice(0,10);
  const tlPrev=()=>{const d=new Date(tlDate+'T12:00:00');d.setDate(d.getDate()-1);setTlDate(d.toISOString().slice(0,10))};
  const tlNext=()=>{const d=new Date(tlDate+'T12:00:00');d.setDate(d.getDate()+1);if(d.toISOString().slice(0,10)<=td)setTlDate(d.toISOString().slice(0,10))};
  const tlIsToday=tlDate===td;
  const tlLbl=tlIsToday?"Heute":new Date(tlDate+'T12:00:00').toLocaleDateString('de-CH',{weekday:'short',day:'numeric',month:'short'});

  return<div style={{animation:"fadeIn .3s"}}>
    <PageHeader title="Auswertungen" icon={"\u{1F4CA}"} isMobile={isMobile} setMenuOpen={setMenuOpen}/>
    <PeriodSelector {...{period,setPeriod,offset,setOffset}} color="#2980b9"/>

    {/* Summary */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
      <div style={{...S.card,textAlign:"center",padding:"14px 8px"}}><div style={{fontSize:24,fontWeight:700,color:T.blue}}>{fmtMins(totalMins)}</div><div style={{fontSize:11,color:T.textSec}}>AKTUELL</div></div>
      <div style={{...S.card,textAlign:"center",padding:"14px 8px"}}><div style={{fontSize:24,fontWeight:700,color:T.textSec}}>{fmtMins(prevMins)}</div><div style={{fontSize:11,color:T.textSec}}>{prevLbl(period).toUpperCase()}</div></div>
      <div style={{...S.card,textAlign:"center",padding:"14px 8px"}}><div style={{fontSize:24,fontWeight:700,color:diff>=0?T.green:T.accent}}>{diff>=0?'+':''}{fmtMins(Math.abs(diff))}</div><div style={{fontSize:11,color:diff>=0?T.green:T.accent}}>{pctChange>=0?'+':''}{pctChange}%</div></div>
    </div>

    {/* Donut + category breakdown */}
    {donutData.length>0&&<div style={{...S.card,marginBottom:16}}>
      <div style={S.lbl}>VERTEILUNG NACH KATEGORIE</div>
      <div style={{display:"flex",gap:20,alignItems:"center",flexWrap:"wrap",marginTop:8}}>
        <Donut data={donutData} size={140}/>
        <div style={{flex:1,minWidth:160}}>
          {catsWithData.map(c=>{
            const cur=parseInt(c.total_mins||0);const prev=parseInt(c.prev_mins||0);const cdiff=cur-prev;const pct=totalMins>0?Math.round(cur/totalMins*100):0;const col=catColor(c.id);
            return<div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0"}}>
              <div style={{width:6,height:22,borderRadius:3,background:col}}/>
              <div style={{flex:1}}><div style={{fontSize:14,fontWeight:600}}>{c.name}</div></div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:14,fontWeight:700,color:col}}>{fmtMins(cur)} <span style={{fontSize:12,color:T.textSec,fontWeight:400}}>{pct}%</span></div>
                {prev>0&&cdiff!==0&&<div style={{fontSize:11,color:cdiff>0?T.green:T.accent}}>{cdiff>0?'+':''}{fmtMins(Math.abs(cdiff))}</div>}
              </div>
            </div>})}
        </div>
      </div>
    </div>}

    {/* Labels breakdown */}
    {Object.keys(labelByCat).length>0&&<div style={{...S.card,marginBottom:16}}>
      <div style={S.lbl}>NACH LABEL</div>
      {Object.entries(labelByCat).map(([cid,items])=>{
        const col=catColor(cid);const catTotal=items.reduce((s,l)=>s+parseInt(l.total_mins||0),0);
        const cn=catsWithData.find(c=>String(c.id)===String(cid))?.name||'';
        const maxL=Math.max(1,...items.map(l=>parseInt(l.total_mins||0)));
        return<div key={cid} style={{marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <div style={{width:10,height:10,borderRadius:3,background:col}}/>
            <span style={{fontSize:14,fontWeight:700}}>{cn}</span>
            <span style={{fontSize:12,color:T.textSec}}>{fmtMins(catTotal)}</span>
          </div>
          {items.map((l,i)=>{const m=parseInt(l.total_mins||0);const pct=catTotal>0?Math.round(m/catTotal*100):0;
            return<div key={i} style={{marginBottom:6,paddingLeft:18}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                <span style={{fontSize:13,fontWeight:600}}>{l.label}</span>
                <span style={{fontSize:13,fontWeight:700,color:col}}>{fmtMins(m)} <span style={{fontSize:11,color:T.textSec,fontWeight:400}}>{pct}%</span></span>
              </div>
              <div style={{height:6,background:T.border,borderRadius:3,overflow:"hidden"}}>
                <div style={{width:Math.round(m/maxL*100)+'%',height:'100%',background:col,borderRadius:3,transition:"width .4s"}}/>
              </div>
            </div>})}
        </div>})}
    </div>}

    {/* Daily Timeline */}
    <div style={{...S.card,marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={S.lbl}>TAGES-TIMELINE</div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <button onClick={tlPrev} style={{background:"none",border:"none",color:T.textSec,fontSize:18,cursor:"pointer",padding:"2px 6px"}}>{"\u25C0"}</button>
          <span style={{fontSize:14,fontWeight:700,color:tlIsToday?T.green:T.text,minWidth:100,textAlign:"center"}}>{tlLbl}</span>
          <button onClick={tlNext} disabled={tlIsToday} style={{background:"none",border:"none",color:tlIsToday?T.border:T.textSec,fontSize:18,cursor:tlIsToday?"default":"pointer",padding:"2px 6px"}}>{"\u25B6"}</button>
        </div>
      </div>

      {tl.blocks&&tl.blocks.length>0?<div>
        {/* Visual bar */}
        <div style={{display:"flex",height:32,borderRadius:8,overflow:"hidden",marginBottom:12,border:"1px solid "+T.border}}>
          {tl.blocks.map((b,i)=>{
            const w=tl.totalRange>0?(b.mins/tl.totalRange*100):0;
            if(w<0.5)return null;
            const col=b.type==='gap'?T.border:catColor(b.category_id);
            return<div key={i} style={{width:w+'%',height:'100%',background:b.type==='gap'?T.bg:col,display:"flex",alignItems:"center",justifyContent:"center",minWidth:b.type==='gap'?2:4,borderRight:i<tl.blocks.length-1?"1px solid "+T.bg:"none"}} title={(b.type==='gap'?'Lücke':((b.label||catName(b.category_id))))+': '+fmtT(b.startM)+'–'+fmtT(b.endM)}>
              {w>8&&<span style={{fontSize:10,color:b.type==='gap'?T.textMuted:'#fff',fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",padding:"0 4px"}}>{b.type==='gap'?'':b.label||''}</span>}
            </div>})}
        </div>

        {/* Detail list */}
        {tl.blocks.map((b,i)=>{
          const col=b.type==='gap'?T.textMuted:catColor(b.category_id);
          return<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderBottom:i<tl.blocks.length-1?"1px solid "+T.border:"none"}}>
            <div style={{width:4,height:24,borderRadius:2,background:b.type==='gap'?T.border:col}}/>
            <span style={{fontSize:13,color:T.blue,fontVariantNumeric:"tabular-nums",minWidth:90}}>{fmtT(b.startM)}–{fmtT(b.endM)}</span>
            <span style={{fontSize:14,fontWeight:700,color:b.type==='gap'?T.textMuted:T.text,flex:1}}>{b.type==='gap'?'– nicht erfasst –':(b.label||'ohne Label')}</span>
            {b.type!=='gap'&&<span style={{fontSize:12,color:col,fontWeight:600}}>{catName(b.category_id)}</span>}
            <span style={{fontSize:13,fontWeight:700,color:b.type==='gap'?T.textMuted:col,minWidth:40,textAlign:"right"}}>{fmtMins(b.mins)}</span>
          </div>})}

        {/* Summary */}
        {(()=>{const gapMins=tl.blocks.filter(b=>b.type==='gap').reduce((s,b)=>s+b.mins,0);const tracked=tl.blocks.filter(b=>b.type==='entry').reduce((s,b)=>s+b.mins,0);
          return gapMins>0?<div style={{display:"flex",justifyContent:"space-between",marginTop:10,padding:"10px 0 0",borderTop:"1px solid "+T.border}}>
            <span style={{fontSize:13,color:T.textSec}}>Erfasst: <b style={{color:T.green}}>{fmtMins(tracked)}</b></span>
            <span style={{fontSize:13,color:T.textSec}}>Lücken: <b style={{color:T.accent}}>{fmtMins(gapMins)}</b></span>
          </div>:null
        })()}
      </div>
      :<div style={{textAlign:"center",padding:"20px 0",color:T.textMuted,fontSize:14}}>Keine Einträge an diesem Tag</div>}
    </div>

    {totalMins===0&&!tl.blocks?.length&&<div style={S.card}><Empty icon={"\u{1F552}"} title="Keine Daten" sub="Erfasse Zeiten um Statistiken zu sehen"/></div>}
  </div>
}

/* ============ LESSONS LEARNED ============ */
function LessonsTab({categories,isMobile,setMenuOpen}){
  const[lessons,setLessons]=useState([]);const[showAdd,setShowAdd]=useState(false);const[editL,setEditL]=useState(null);
  const[lTitle,setLT]=useState("");const[lContent,setLC]=useState("");const[lCat,setLCat]=useState("");const[lDate,setLD]=useState(new Date().toISOString().slice(0,10));
  const[filter,setFilter]=useState("all");
  const load=()=>api.get('lessons').then(d=>setLessons(Array.isArray(d)?d:[]));
  useEffect(()=>{load()},[]);
  const save=async()=>{
    if(!lTitle.trim())return;
    const d={title:lTitle.trim(),content:lContent.trim(),categoryId:lCat?parseInt(lCat):null,entryDate:lDate};
    if(editL)await api.put('lessons/'+editL.id,d);else await api.post('lessons',d);
    setShowAdd(false);setEditL(null);setLT("");setLC("");setLCat("");load();
  };
  const startEdit=l=>{setEditL(l);setLT(l.title);setLC(l.content||"");setLCat(l.category_id||"");setLD(l.entry_date||new Date().toISOString().slice(0,10));setShowAdd(true)};
  const del=async id=>{if(confirm("Löschen?")){await api.del('lessons/'+id);load()}};
  const filtered=filter==="all"?lessons:lessons.filter(l=>l.category_id==filter);
  const grouped={};filtered.forEach(l=>{const d=l.entry_date;if(!grouped[d])grouped[d]=[];grouped[d].push(l)});
  return<div style={{animation:"fadeIn .3s"}}>
    <PageHeader title="Lessons Learned" icon={"\u{1F4D6}"} isMobile={isMobile} setMenuOpen={setMenuOpen}>
      <button onClick={()=>{setEditL(null);setLT("");setLC("");setLCat("");setLD(new Date().toISOString().slice(0,10));setShowAdd(true)}} style={S.btn("#8e44ad")}>+ Lesson</button>
    </PageHeader>
    <select value={filter} onChange={e=>setFilter(e.target.value)} style={{...S.sel,marginBottom:16}}><option value="all">Alle Kategorien</option>{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
    {Object.keys(grouped).length===0?<div style={S.card}><Empty icon={"\u{1F4D6}"} title="Keine Einträge" sub="Halte deine Learnings fest!"/></div>
    :Object.entries(grouped).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,ls])=><div key={d} style={{marginBottom:16}}>
      <div style={{fontSize:14,fontWeight:700,marginBottom:8,color:T.text,borderBottom:"1px solid "+T.border,paddingBottom:6}}>{fmtDate(d)}</div>
      {ls.map(l=><div key={l.id} style={{...S.card,padding:"14px 16px",marginBottom:8,borderLeft:"3px solid #8e44ad"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{l.title}</div>
            {l.cat_name&&<span style={S.badge("#8e44ad")}>{l.cat_name}</span>}
            {l.content&&<div style={{fontSize:13,color:T.textSec,marginTop:8,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{l.content}</div>}
          </div>
          <div style={{display:"flex",gap:4,flexShrink:0,marginLeft:8}}>
            <button onClick={()=>startEdit(l)} style={S.btnO()}>{"\u270E"}</button>
            <button onClick={()=>del(l.id)} style={S.btnO(T.accent)}>{"\u2715"}</button>
          </div>
        </div>
      </div>)}
    </div>)}
    <Modal open={showAdd} onClose={()=>{setShowAdd(false);setEditL(null)}} title={editL?"Lesson bearbeiten":"Neue Lesson"}>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div><div style={S.lbl}>DATUM</div><input type="date" style={S.inp} value={lDate} onChange={e=>setLD(e.target.value)}/></div>
        <div><div style={S.lbl}>TITEL</div><input style={S.inp} value={lTitle} onChange={e=>setLT(e.target.value)} placeholder="Was habe ich gelernt?" autoFocus/></div>
        <div><div style={S.lbl}>KATEGORIE</div><select style={S.sel} value={lCat} onChange={e=>setLCat(e.target.value)}><option value="">{"—"} Keine</option>{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
        <div><div style={S.lbl}>DETAILS</div><textarea style={{...S.inp,minHeight:120,resize:"vertical"}} value={lContent} onChange={e=>setLC(e.target.value)} placeholder="Beschreibung, Kontext, was ich anders machen werde..."/></div>
        <button onClick={save} disabled={!lTitle.trim()} style={{...S.btn("#8e44ad"),opacity:lTitle.trim()?1:.4}}>{editL?"Speichern":"Hinzufügen"}</button>
      </div>
    </Modal>
  </div>
}

/* ============ FITNESS ============ */
function FitnessTab({isMobile,setMenuOpen,loadData}){
  const[view,setView]=useState("plans");
  const[plans,setPlans]=useState([]);const[days,setDays]=useState([]);const[exercises,setExercises]=useState([]);
  const[sessions,setSessions]=useState([]);const[activeSession,setAS]=useState(null);
  const[fGoals,setFG]=useState([]);const[selPlan,setSelPlan]=useState(null);const[selDay,setSelDay]=useState(null);
  const[showAddPlan,setSAP]=useState(false);const[showAddDay,setSAD]=useState(false);const[showAddEx,setSAE]=useState(false);
  const[showAddGoal,setSAFG]=useState(false);
  const[pName,setPN]=useState("");const[pDesc,setPD]=useState("");
  const[dName,setDN]=useState("");const[dFocus,setDF]=useState("");
  const[eName,setEN]=useState("");const[eSets,setES]=useState("3");const[eReps,setER]=useState("10");const[eWeights,setEW]=useState("");const[eNote,setENt]=useState("");
  const[fgName,setFGN]=useState("");const[fgType,setFGT]=useState("reps");const[fgTarget,setFGTar]=useState("");const[fgCurrent,setFGC]=useState("0");const[fgUnit,setFGU]=useState("");const[fgDeadline,setFGD]=useState("");

  const loadPlans=()=>api.get('fitness/plans').then(d=>setPlans(Array.isArray(d)?d:[]));
  const loadDays=pid=>api.get('fitness/plans/'+pid+'/days').then(d=>{setDays(Array.isArray(d)?d:[])});
  const loadExercises=did=>api.get('fitness/days/'+did+'/exercises').then(d=>setExercises(Array.isArray(d)?d:[]));
  const loadSessions=()=>api.get('fitness/sessions').then(d=>setSessions(Array.isArray(d)?d:[]));
  const loadActive=()=>api.get('fitness/sessions/active').then(d=>{if(d&&d.id)setAS(d);else setAS(null)});
  const loadFGoals=()=>api.get('fitness/goals').then(d=>setFG(Array.isArray(d)?d:[]));

  useEffect(()=>{loadPlans();loadSessions();loadActive();loadFGoals()},[]);
  useEffect(()=>{if(selPlan)loadDays(selPlan.id)},[selPlan]);
  useEffect(()=>{if(selDay)loadExercises(selDay.id)},[selDay]);

  const savePlan=async()=>{if(!pName.trim())return;await api.post('fitness/plans',{name:pName.trim(),description:pDesc.trim()});setSAP(false);setPN("");setPD("");loadPlans()};
  const saveDay=async()=>{if(!dName.trim()||!selPlan)return;await api.post('fitness/plans/'+selPlan.id+'/days',{dayName:dName.trim(),focus:dFocus.trim()});setSAD(false);setDN("");setDF("");loadDays(selPlan.id)};
  const saveExercise=async()=>{if(!eName.trim()||!selDay)return;await api.post('fitness/days/'+selDay.id+'/exercises',{exerciseName:eName.trim(),targetSets:parseInt(eSets)||3,targetReps:parseInt(eReps)||10,targetWeights:eWeights.trim(),note:eNote.trim()});setSAE(false);setEN("");setES("3");setER("10");setEW("");setENt("");loadExercises(selDay.id)};
  const saveFGoal=async()=>{if(!fgName.trim()||!fgTarget)return;await api.post('fitness/goals',{exerciseName:fgName.trim(),goalType:fgType,targetValue:parseFloat(fgTarget),currentValue:parseFloat(fgCurrent)||0,unit:fgUnit,deadline:fgDeadline||null});setSAFG(false);setFGN("");setFGTar("");setFGC("0");loadFGoals()};

  const startSession=async(dayId)=>{const r=await api.post('fitness/days/'+dayId+'/start-session',{});if(r.id){setView("session");loadActive()}};
  const endSession=async()=>{if(!activeSession)return;await api.post('fitness/sessions/'+activeSession.id+'/end',{});setAS(null);setView("history");loadSessions()};
  const logSet=async(setId,reps,weight)=>{if(!activeSession)return;await api.post('fitness/sessions/'+activeSession.id+'/log-set',{setId,actualReps:parseInt(reps),actualWeight:weight?parseFloat(weight):null});loadActive()};
  const toggleSet=async(setId)=>{await api.post('fitness/sets/'+setId+'/toggle',{});loadActive()};

  // Group sets by exercise
  const groupSets=(sets)=>{const g={};(sets||[]).forEach(s=>{if(!g[s.exercise_name])g[s.exercise_name]=[];g[s.exercise_name].push(s)});return g};

  const subNav=[{k:"plans",l:"Pläne"},{k:"session",l:"Training"},{k:"history",l:"History"},{k:"fgoals",l:"Fitness Goals"}];

  return<div style={{animation:"fadeIn .3s"}}>
    <PageHeader title="Fitness" icon={"\u{1F4AA}"} isMobile={isMobile} setMenuOpen={setMenuOpen}/>
    <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>{subNav.map(n=><button key={n.k} onClick={()=>setView(n.k)} style={{...view===n.k?S.btn("#e67e22"):S.btnO("#e67e22"),fontSize:12}}>{n.l}</button>)}</div>

    {/* PLANS */}
    {view==="plans"&&<div>
      <div style={{display:"flex",gap:8,marginBottom:12}}><button onClick={()=>setSAP(true)} style={S.btn("#e67e22")}>+ Plan</button></div>
      {!selPlan?<div>
        {plans.length===0?<div style={S.card}><Empty icon={"\u{1F4AA}"} title="Keine Pläne" sub="Erstelle deinen Trainingsplan"/></div>
        :plans.map(p=><div key={p.id} style={{...S.card,padding:"14px 16px",marginBottom:8,borderLeft:"3px solid #e67e22",cursor:"pointer"}} onClick={()=>setSelPlan(p)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><div style={{fontWeight:700,fontSize:15}}>{p.name}</div>{p.description&&<div style={{fontSize:12,color:T.textSec}}>{p.description}</div>}<div style={{fontSize:11,color:T.textMuted,marginTop:4}}>{p.day_count} Tage</div></div>
            <div style={{display:"flex",gap:4}}><button onClick={e=>{e.stopPropagation();if(confirm("Plan löschen?")){api.del('fitness/plans/'+p.id).then(loadPlans)}}} style={S.btnO(T.accent)}>{"\u2715"}</button></div>
          </div>
        </div>)}
      </div>
      :<div>
        <button onClick={()=>{setSelPlan(null);setSelDay(null)}} style={{...S.btnO(),marginBottom:12}}>{"\u2190"} Zurück</button>
        <div style={{...S.card,marginBottom:12}}><div style={{fontWeight:700,fontSize:18}}>{selPlan.name}</div>{selPlan.description&&<div style={{fontSize:12,color:T.textSec,marginTop:4}}>{selPlan.description}</div>}</div>
        <div style={{display:"flex",gap:8,marginBottom:12}}><button onClick={()=>setSAD(true)} style={S.btnSm("#e67e22")}>+ Tag</button></div>

        {!selDay?days.map(d=><div key={d.id} style={{...S.card,padding:"12px 16px",marginBottom:8,cursor:"pointer",borderLeft:"3px solid "+T.orange}} onClick={()=>setSelDay(d)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><span style={{fontWeight:700}}>{d.day_name}</span>{d.focus&&<span style={{color:T.textSec}}> — {d.focus}</span>}<div style={{fontSize:11,color:T.textMuted}}>{d.ex_count} Übungen</div></div>
            <div style={{display:"flex",gap:4}}>
              <button onClick={e=>{e.stopPropagation();startSession(d.id)}} style={S.btnSm(T.green)}>{"\u25B6"} Start</button>
              <button onClick={e=>{e.stopPropagation();api.del('fitness/days/'+d.id).then(()=>loadDays(selPlan.id))}} style={S.btnO(T.accent)}>{"\u2715"}</button>
            </div>
          </div>
        </div>)
        :<div>
          <button onClick={()=>setSelDay(null)} style={{...S.btnO(),marginBottom:12}}>{"\u2190"} {selDay.day_name}</button>
          <div style={{...S.card,marginBottom:12}}><div style={{fontWeight:700,fontSize:16}}>{selDay.day_name}: {selDay.focus}</div></div>
          <button onClick={()=>setSAE(true)} style={{...S.btnSm("#e67e22"),marginBottom:12}}>+ Übung</button>
          {exercises.map((ex,i)=><div key={ex.id} style={{...S.card,padding:"12px 16px",marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:700,fontSize:14}}>{i+1}. {ex.exercise_name}</div>
                <div style={{fontSize:12,color:T.textSec,marginTop:2}}>{ex.target_sets} Sets × {ex.target_reps} Reps</div>
                {ex.target_weights&&<div style={{fontSize:12,color:T.blue,marginTop:2}}>Gewichte: {ex.target_weights} kg</div>}
                {ex.note&&<div style={{fontSize:11,color:T.textMuted,marginTop:2}}>{ex.note}</div>}
              </div>
              <button onClick={()=>api.del('fitness/exercises/'+ex.id).then(()=>loadExercises(selDay.id))} style={S.btnO(T.accent)}>{"\u2715"}</button>
            </div>
          </div>)}
          <button onClick={()=>startSession(selDay.id)} style={{...S.btn(T.green),width:"100%",marginTop:12}}>{"\u25B6"} Training starten</button>
        </div>}
      </div>}
    </div>}

    {/* ACTIVE SESSION */}
    {view==="session"&&<div>
      {!activeSession?<div style={S.card}><Empty icon={"\u{1F3CB}"} title="Kein aktives Training" sub="Starte ein Training von einem Plan"/></div>
      :<div>
        <div style={{...S.card,marginBottom:12,borderColor:T.green}}>
          <div style={{fontSize:11,fontWeight:700,color:T.green,letterSpacing:2,marginBottom:4,animation:"pulse 2s infinite"}}>{"\u25CF"} TRAINING AKTIV</div>
          <div style={{fontWeight:700,fontSize:16}}>{activeSession.session_name}</div>
          <div style={{fontSize:12,color:T.textSec,marginTop:4}}>Start: {new Date(activeSession.started_at).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})}</div>
          <div style={{fontSize:12,color:T.textSec,marginTop:2}}>{(activeSession.sets||[]).filter(s=>s.done).length}/{(activeSession.sets||[]).length} Sets erledigt</div>
        </div>
        {Object.entries(groupSets(activeSession.sets)).map(([exName,sets])=><div key={exName} style={{...S.card,padding:"14px 16px",marginBottom:10}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>{exName}</div>
          <div style={{display:"grid",gridTemplateColumns:"40px 1fr 1fr 1fr 50px",gap:4,marginBottom:4}}>
            <div style={{fontSize:10,color:T.textSec,fontWeight:700}}>SET</div>
            <div style={{fontSize:10,color:T.textSec,fontWeight:700}}>ZIEL</div>
            <div style={{fontSize:10,color:T.textSec,fontWeight:700}}>REPS</div>
            <div style={{fontSize:10,color:T.textSec,fontWeight:700}}>KG</div>
            <div/>
          </div>
          {sets.map(s=><SetRow key={s.id} s={s} onLog={logSet} onToggle={toggleSet}/>)}
        </div>)}
        <button onClick={endSession} style={{...S.btn(T.accent),width:"100%",marginTop:8}}>{"\u23F9"} Training beenden</button>
      </div>}
    </div>}

    {/* HISTORY */}
    {view==="history"&&<div>
      {sessions.length===0?<div style={S.card}><Empty icon={"\u{1F4CB}"} title="Keine Trainings" sub="Starte dein erstes Training"/></div>
      :sessions.map(s=>{const pct=s.sets_total>0?Math.round(s.sets_done/s.sets_total*100):0;
        return<div key={s.id} style={{...S.card,padding:"12px 16px",marginBottom:8,borderLeft:"3px solid "+(s.ended_at?T.green:T.orange)}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <div><div style={{fontWeight:700,fontSize:14}}>{s.session_name||"Training"}</div><div style={{fontSize:11,color:T.textSec}}>{new Date(s.started_at).toLocaleString('de-CH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}{s.ended_at?' – '+new Date(s.ended_at).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}):' (aktiv)'}</div></div>
            <span style={{fontWeight:700,fontSize:16,color:pct>=80?T.green:pct>=50?T.orange:T.accent}}>{pct}%</span>
          </div>
          <Bar pct={pct} color={pct>=80?T.green:pct>=50?T.orange:T.accent}/>
          <div style={{fontSize:11,color:T.textMuted,marginTop:4}}>{s.sets_done}/{s.sets_total} Sets</div>
        </div>})}
    </div>}

    {/* FITNESS GOALS */}
    {view==="fgoals"&&<div>
      <button onClick={()=>setSAFG(true)} style={{...S.btn("#e67e22"),marginBottom:12}}>+ Fitness Goal</button>
      {fGoals.length===0?<div style={S.card}><Empty icon={"\u{1F3AF}"} title="Keine Fitness Goals" sub="z.B. 100 Liegestütze in 3 Monaten"/></div>
      :fGoals.map(fg=>{const pct=fg.target_value>0?Math.min(100,Math.round(fg.current_value/fg.target_value*100)):0;
        return<div key={fg.id} style={{...S.card,padding:"14px 16px",marginBottom:8,borderLeft:"3px solid #e67e22"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div><div style={{fontWeight:700,fontSize:15}}>{fg.exercise_name}</div>{fg.deadline&&<div style={{fontSize:11,color:T.textSec}}>Deadline: {fmtDate(fg.deadline)} ({daysLeft(fg.deadline)}d)</div>}</div>
            <button onClick={()=>{const v=prompt("Aktueller Wert:",fg.current_value);if(v!==null)api.put('fitness/goals/'+fg.id,{...fg,exerciseName:fg.exercise_name,currentValue:parseFloat(v)}).then(loadFGoals)}} style={S.btnSm(T.blue)}>{"\u270E"}</button>
          </div>
          <div style={{display:"flex",gap:12,marginBottom:8}}>
            <div style={{textAlign:"center",flex:1,padding:8,background:T.bg,borderRadius:8}}><div style={{fontSize:22,fontWeight:700,color:T.text}}>{fg.current_value}</div><div style={{fontSize:9,color:T.textSec}}>IST</div></div>
            <div style={{textAlign:"center",flex:1,padding:8,background:T.bg,borderRadius:8}}><div style={{fontSize:22,fontWeight:700,color:T.green}}>{fg.target_value}</div><div style={{fontSize:9,color:T.textSec}}>ZIEL {fg.unit}</div></div>
          </div>
          <Bar pct={pct} color={pct>=100?T.green:"#e67e22"}/>
        </div>})}
    </div>}

    {/* MODALS */}
    <Modal open={showAddPlan} onClose={()=>setSAP(false)} title="Neuer Plan"><div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div><div style={S.lbl}>NAME</div><input style={S.inp} value={pName} onChange={e=>setPN(e.target.value)} placeholder="z.B. Push Pull Legs" autoFocus/></div>
      <div><div style={S.lbl}>BESCHREIBUNG</div><input style={S.inp} value={pDesc} onChange={e=>setPD(e.target.value)} placeholder="Optional"/></div>
      <button onClick={savePlan} disabled={!pName.trim()} style={{...S.btn("#e67e22"),opacity:pName.trim()?1:.4}}>Erstellen</button>
    </div></Modal>
    <Modal open={showAddDay} onClose={()=>setSAD(false)} title="Neuer Tag"><div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div><div style={S.lbl}>TAG</div><input style={S.inp} value={dName} onChange={e=>setDN(e.target.value)} placeholder="z.B. Montag" autoFocus/></div>
      <div><div style={S.lbl}>FOKUS</div><input style={S.inp} value={dFocus} onChange={e=>setDF(e.target.value)} placeholder="z.B. Brust / Trizeps"/></div>
      <button onClick={saveDay} disabled={!dName.trim()} style={{...S.btn("#e67e22"),opacity:dName.trim()?1:.4}}>Hinzufügen</button>
    </div></Modal>
    <Modal open={showAddEx} onClose={()=>setSAE(false)} title="Neue Übung"><div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div><div style={S.lbl}>ÜBUNG</div><input style={S.inp} value={eName} onChange={e=>setEN(e.target.value)} placeholder="z.B. Bench Press" autoFocus/></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div><div style={S.lbl}>SETS</div><input type="number" style={S.inp} value={eSets} onChange={e=>setES(e.target.value)}/></div>
        <div><div style={S.lbl}>REPS</div><input type="number" style={S.inp} value={eReps} onChange={e=>setER(e.target.value)}/></div>
      </div>
      <div><div style={S.lbl}>GEWICHTE (kommasep.)</div><input style={S.inp} value={eWeights} onChange={e=>setEW(e.target.value)} placeholder="z.B. 20, 25, 30, 35, 40"/></div>
      <div><div style={S.lbl}>NOTIZ</div><input style={S.inp} value={eNote} onChange={e=>setENt(e.target.value)} placeholder="Optional"/></div>
      <button onClick={saveExercise} disabled={!eName.trim()} style={{...S.btn("#e67e22"),opacity:eName.trim()?1:.4}}>Hinzufügen</button>
    </div></Modal>
    <Modal open={showAddGoal} onClose={()=>setSAFG(false)} title="Neues Fitness Goal"><div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div><div style={S.lbl}>ÜBUNG</div><input style={S.inp} value={fgName} onChange={e=>setFGN(e.target.value)} placeholder="z.B. Liegestütze" autoFocus/></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div><div style={S.lbl}>TYP</div><select style={S.sel} value={fgType} onChange={e=>setFGT(e.target.value)}><option value="reps">Reps</option><option value="weight">Gewicht</option><option value="time">Zeit</option></select></div>
        <div><div style={S.lbl}>EINHEIT</div><input style={S.inp} value={fgUnit} onChange={e=>setFGU(e.target.value)} placeholder="z.B. Stk, kg, min"/></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div><div style={S.lbl}>ZIELWERT</div><input type="number" style={S.inp} value={fgTarget} onChange={e=>setFGTar(e.target.value)} placeholder="100"/></div>
        <div><div style={S.lbl}>AKTUELL</div><input type="number" style={S.inp} value={fgCurrent} onChange={e=>setFGC(e.target.value)} placeholder="0"/></div>
      </div>
      <div><div style={S.lbl}>DEADLINE</div><input type="date" style={S.inp} value={fgDeadline} onChange={e=>setFGD(e.target.value)}/></div>
      <button onClick={saveFGoal} disabled={!fgName.trim()||!fgTarget} style={{...S.btn("#e67e22"),opacity:fgName.trim()&&fgTarget?1:.4}}>Erstellen</button>
    </div></Modal>
  </div>
}

function SetRow({s,onLog,onToggle}){
  const[reps,setR]=useState(String(s.actual_reps||s.target_reps||""));
  const[wt,setW]=useState(String(s.actual_weight||s.target_weight||""));
  return<div style={{display:"grid",gridTemplateColumns:"40px 1fr 1fr 1fr 50px",gap:4,padding:"4px 0",borderBottom:"1px solid "+T.border,opacity:s.done?.6:1}}>
    <span style={{fontWeight:700,fontSize:13,color:T.textSec}}>{s.set_number}</span>
    <span style={{fontSize:12,color:T.textMuted}}>{s.target_reps}r{s.target_weight?' / '+s.target_weight+'kg':''}</span>
    <input type="number" style={{...S.inp,fontSize:12,padding:"4px 6px"}} value={reps} onChange={e=>setR(e.target.value)} disabled={s.done}/>
    <input type="number" step="0.5" style={{...S.inp,fontSize:12,padding:"4px 6px"}} value={wt} onChange={e=>setW(e.target.value)} disabled={s.done}/>
    <button onClick={()=>{if(s.done)onToggle(s.id);else onLog(s.id,reps,wt)}} style={{...s.done?S.btnSm(T.green):S.btnSm(T.blue),padding:"4px 8px",fontSize:11}}>{s.done?"\u2713":"OK"}</button>
  </div>
}

/* ============ WEIGHT ============ */
function WeightTab({isMobile,setMenuOpen}){
  const[logs,setLogs]=useState([]);const[target,setTarget]=useState("");
  const[w,setW]=useState("");const[d,setD]=useState(new Date().toISOString().slice(0,10));const[note,setNote]=useState("");
  const[range,setRange]=useState(90);const[editTarget,setET]=useState(false);
  const[editId,setEditId]=useState(null);const[editW,setEditW]=useState("");const[editN,setEditN]=useState("");const[editD,setEditD]=useState("");
  const[tick,setTick]=useState(0);

  const reload=()=>setTick(n=>n+1);

  useEffect(()=>{
    api.get('weight?days='+range).then(res=>{
      if(res&&!res.error){setLogs(Array.isArray(res.logs)?res.logs:[]);setTarget(res.target||"")}
    });
  },[range,tick]);

  const saveWeight=async()=>{
    if(!w)return;
    const res=await api.post('weight',{logDate:d,weight:parseFloat(w),note:note.trim()});
    if(res?.error){alert('Fehler: '+res.error);return}
    setW("");setNote("");setD(new Date().toISOString().slice(0,10));reload();
  };
  const updateWeight=async()=>{
    if(!editW)return;
    const res=await api.post('weight',{logDate:editD,weight:parseFloat(editW),note:editN.trim()});
    if(res?.error){alert('Fehler: '+res.error);return}
    setEditId(null);reload();
  };
  const saveTargetW=async()=>{
    const res=await api.post('weight/target',{target:target});
    if(res?.error){alert('Fehler: '+res.error);return}
    setET(false);reload();
  };
  const delLog=async(id)=>{if(confirm("Eintrag löschen?")){await api.del('weight/'+id);reload()}};
  const startEdit=(l)=>{setEditId(l.id);setEditW(String(l.weight));setEditN(l.note||"");setEditD(l.log_date)};

  const sorted=[...logs].sort((a,b)=>a.log_date.localeCompare(b.log_date));
  const weights=sorted.map(l=>parseFloat(l.weight));
  const tgt=parseFloat(target)||null;
  const latest=logs.length>0?parseFloat(logs[0].weight):null;
  const oldest=sorted.length>0?parseFloat(sorted[0].weight):null;
  const mn=weights.length>0?Math.min(...weights):0;
  const mx=weights.length>0?Math.max(...weights):100;
  const avg=weights.length>0?(weights.reduce((a,b)=>a+b,0)/weights.length).toFixed(1):null;
  const diff=latest&&oldest&&sorted.length>1?(latest-oldest).toFixed(1):null;
  const chartMin=Math.min(mn,tgt||mn)-1;const chartMax=Math.max(mx,tgt||mx)+1;

  const cW=600,cH=200,pad={t:20,r:20,b:30,l:45};
  const pw=cW-pad.l-pad.r,ph=cH-pad.t-pad.b;
  const xScale=i=>pad.l+(sorted.length>1?i/(sorted.length-1)*pw:pw/2);
  const yScale=v=>pad.t+ph-(v-chartMin)/(chartMax-chartMin)*ph;

  return<div style={{animation:"fadeIn .3s"}}>
    <PageHeader title="Gewicht" icon={"\u2696\uFE0F"} isMobile={isMobile} setMenuOpen={setMenuOpen}/>

    <div style={{...S.card,marginBottom:16}}>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
        <div style={{flex:"1 1 100px"}}><div style={S.lbl}>DATUM</div><input type="date" style={S.inp} value={d} onChange={e=>setD(e.target.value)}/></div>
        <div style={{flex:"1 1 80px"}}><div style={S.lbl}>GEWICHT (kg)</div><input type="number" step="0.1" style={{...S.inp,fontSize:18,fontWeight:700,textAlign:"center"}} value={w} onChange={e=>setW(e.target.value)} placeholder="78.5" onKeyDown={e=>e.key==='Enter'&&saveWeight()}/></div>
        <div style={{flex:"2 1 120px"}}><div style={S.lbl}>NOTIZ</div><input style={S.inp} value={note} onChange={e=>setNote(e.target.value)} placeholder="Optional..." onKeyDown={e=>e.key==='Enter'&&saveWeight()}/></div>
        <button onClick={saveWeight} disabled={!w} style={{...S.btn(T.green),opacity:w?1:.4,padding:"10px 20px"}}>Speichern</button>
      </div>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:16}}>
      <div style={{...S.card,textAlign:"center",padding:"12px 8px"}}><div style={{fontSize:22,fontWeight:700,color:T.accent}}>{latest?latest.toFixed(1):"-"}</div><div style={{fontSize:9,color:T.textSec}}>AKTUELL (kg)</div></div>
      <div style={{...S.card,textAlign:"center",padding:"12px 8px"}}><div style={{fontSize:22,fontWeight:700,color:diff&&parseFloat(diff)<0?T.green:diff&&parseFloat(diff)>0?T.accent:T.text}}>{diff?((parseFloat(diff)>0?"+":"")+diff):"-"}</div><div style={{fontSize:9,color:T.textSec}}>{range}d DIFF</div></div>
      <div style={{...S.card,textAlign:"center",padding:"12px 8px"}}><div style={{fontSize:22,fontWeight:700,color:T.blue}}>{avg||"-"}</div><div style={{fontSize:9,color:T.textSec}}>SCHNITT</div></div>
      <div style={{...S.card,textAlign:"center",padding:"12px 8px",cursor:"pointer",outline:editTarget?"2px solid "+T.orange:"none",borderRadius:12}} onClick={()=>setET(!editTarget)}>
        <div style={{fontSize:22,fontWeight:700,color:T.orange}}>{tgt?tgt.toFixed(1):"-"}</div><div style={{fontSize:9,color:T.textSec}}>ZIEL {"\u270E"}</div>
      </div>
    </div>

    {editTarget&&<div style={{...S.card,marginBottom:16}}>
      <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
        <div style={{flex:1}}><div style={S.lbl}>ZIELGEWICHT (kg)</div><input type="number" step="0.1" style={{...S.inp,fontSize:16,fontWeight:700,textAlign:"center"}} value={target} onChange={e=>setTarget(e.target.value)} autoFocus onKeyDown={e=>e.key==='Enter'&&saveTargetW()}/></div>
        <button onClick={saveTargetW} style={{...S.btn(T.orange),padding:"10px 20px"}}>Speichern</button>
        <button onClick={()=>setET(false)} style={{...S.btnO(),padding:"10px 14px"}}>{"\u2715"}</button>
      </div>
    </div>}

    <div style={{display:"flex",gap:6,marginBottom:12}}>
      {[{k:30,l:"30d"},{k:90,l:"90d"},{k:180,l:"6Mt"},{k:365,l:"1J"}].map(r=>
        <button key={r.k} onClick={()=>setRange(r.k)} style={{...(range===r.k?S.btn(T.blue):S.btnO(T.blue)),fontSize:11}}>{r.l}</button>)}
    </div>

    {sorted.length>=2?<div style={{...S.card,padding:12,marginBottom:16}}>
      <svg viewBox={`0 0 ${cW} ${cH}`} style={{width:"100%",height:"auto"}}>
        {Array.from({length:5},(_,i)=>{const v=chartMin+(chartMax-chartMin)*i/4;
          return<g key={i}><line x1={pad.l} y1={yScale(v)} x2={cW-pad.r} y2={yScale(v)} stroke={T.border} strokeWidth="0.5"/>
            <text x={pad.l-6} y={yScale(v)+4} textAnchor="end" fill={T.textMuted} fontSize="10">{v.toFixed(1)}</text></g>})}
        {tgt&&<><line x1={pad.l} y1={yScale(tgt)} x2={cW-pad.r} y2={yScale(tgt)} stroke={T.orange} strokeWidth="1.5" strokeDasharray="6,3"/>
          <text x={cW-pad.r+4} y={yScale(tgt)+4} fill={T.orange} fontSize="10" fontWeight="600">Ziel</text></>}
        <polyline fill="none" stroke={T.accent} strokeWidth="2.5" strokeLinejoin="round"
          points={sorted.map((l,i)=>xScale(i)+","+yScale(parseFloat(l.weight))).join(" ")}/>
        <polygon fill={T.accent+"18"} points={
          sorted.map((l,i)=>xScale(i)+","+yScale(parseFloat(l.weight))).join(" ")+
          " "+xScale(sorted.length-1)+","+yScale(chartMin)+" "+xScale(0)+","+yScale(chartMin)}/>
        {sorted.map((l,i)=><circle key={i} cx={xScale(i)} cy={yScale(parseFloat(l.weight))} r="3.5" fill={T.accent} stroke={T.card} strokeWidth="1.5"/>)}
        {sorted.filter((_,i)=>sorted.length<=10||i%(Math.ceil(sorted.length/8))===0||i===sorted.length-1).map(l=>
          <text key={l.log_date} x={xScale(sorted.indexOf(l))} y={cH-6} textAnchor="middle" fill={T.textMuted} fontSize="9">
            {new Date(l.log_date).toLocaleDateString('de-CH',{day:'numeric',month:'short'})}
          </text>)}
      </svg>
    </div>
    :sorted.length===1?<div style={{...S.card,padding:20,textAlign:"center",marginBottom:16,color:T.textSec}}>Mindestens 2 Einträge für Chart nötig</div>
    :null}

    {logs.length>0&&<div style={{...S.card,padding:0,overflow:"hidden",marginBottom:16}}>
      <div style={{padding:"12px 16px",borderBottom:"1px solid "+T.border,fontWeight:700,fontSize:13}}>Verlauf ({logs.length})</div>
      {logs.slice(0,50).map((l,i)=>{
        const prev=logs[i+1]?parseFloat(logs[i+1].weight):null;const cur=parseFloat(l.weight);const ch=prev?(cur-prev).toFixed(1):null;
        const isEditing=editId===l.id;
        return<div key={l.id} style={{borderBottom:"1px solid "+T.border+"40"}}>
          {isEditing?<div style={{padding:"10px 16px",background:T.bg}}>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
              <div style={{flex:"1 1 100px"}}><div style={{...S.lbl,fontSize:9}}>DATUM</div><input type="date" style={{...S.inp,fontSize:12,padding:"6px 8px"}} value={editD} onChange={e=>setEditD(e.target.value)}/></div>
              <div style={{flex:"0 1 80px"}}><div style={{...S.lbl,fontSize:9}}>KG</div><input type="number" step="0.1" style={{...S.inp,fontSize:14,fontWeight:700,padding:"6px 8px",textAlign:"center"}} value={editW} onChange={e=>setEditW(e.target.value)} onKeyDown={e=>e.key==='Enter'&&updateWeight()}/></div>
              <div style={{flex:"2 1 100px"}}><div style={{...S.lbl,fontSize:9}}>NOTIZ</div><input style={{...S.inp,fontSize:12,padding:"6px 8px"}} value={editN} onChange={e=>setEditN(e.target.value)} onKeyDown={e=>e.key==='Enter'&&updateWeight()}/></div>
              <button onClick={updateWeight} style={{...S.btn(T.green),fontSize:11,padding:"6px 14px"}}>{"\u2713"}</button>
              <button onClick={()=>setEditId(null)} style={{...S.btnO(),fontSize:11,padding:"6px 10px"}}>{"\u2715"}</button>
            </div>
          </div>
          :<div style={{display:"flex",alignItems:"center",padding:"10px 16px",gap:10}}>
            <div style={{fontSize:12,color:T.textSec,width:70,flexShrink:0}}>{new Date(l.log_date).toLocaleDateString('de-CH',{day:'numeric',month:'short'})}</div>
            <div style={{fontSize:16,fontWeight:700,width:65,flexShrink:0}}>{cur.toFixed(1)}</div>
            {ch&&<div style={{fontSize:12,fontWeight:600,color:parseFloat(ch)<0?T.green:parseFloat(ch)>0?T.accent:T.textMuted,width:45,flexShrink:0}}>{parseFloat(ch)>0?"+":""}{ch}</div>}
            <div style={{fontSize:11,color:T.textMuted,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.note||""}</div>
            <button onClick={()=>startEdit(l)} style={{...S.btnO(T.blue),padding:"3px 8px",fontSize:10}}>{"\u270E"}</button>

/* ============ LOCK SCREEN ============ */
function LockScreen({onUnlock}){
  const[pw,setPW]=useState("");const[pw2,setPW2]=useState("");const[err,setErr]=useState("");const[loading,setL]=useState(false);
  const first=isFirstTime();
  const submit=async()=>{
    setErr("");setL(true);
    if(first){
      if(pw.length<4){setErr("Mindestens 4 Zeichen");setL(false);return}
      if(pw!==pw2){setErr("Passwörter stimmen nicht überein");setL(false);return}
      const ok=await checkPassword(pw);
      if(ok)onUnlock();else{setErr("Fehler");setL(false)}
    }else{
      const ok=await checkPassword(pw);
      if(ok)onUnlock();else{setErr("Falsches Passwort");setL(false);setPW("")}
    }
  };
  return<div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:T.bg,padding:24}}>
    <div style={{...S.card,maxWidth:360,width:"100%",textAlign:"center"}}>
      <div style={{fontSize:48,marginBottom:16}}>{"\u{1F512}"}</div>
      <h2 style={{fontSize:20,fontWeight:700,marginBottom:4}}>TimeFlow</h2>
      <div style={{fontSize:13,color:T.textSec,marginBottom:24}}>{first?"Setze ein Passwort für deine Daten":"Passwort eingeben"}</div>
      <div style={{marginBottom:12}}>
        <input type="password" style={{...S.inp,textAlign:"center",fontSize:20,letterSpacing:4}} placeholder={first?"Neues Passwort":"Passwort"} value={pw} onChange={e=>setPW(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(!first?submit():null)} autoFocus/>
      </div>
      {first&&<div style={{marginBottom:12}}>
        <input type="password" style={{...S.inp,textAlign:"center",fontSize:20,letterSpacing:4}} placeholder="Wiederholen" value={pw2} onChange={e=>setPW2(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}/>
      </div>}
      {err&&<div style={{color:T.accent,fontSize:13,marginBottom:12}}>{err}</div>}
      <button onClick={submit} disabled={loading} style={{...S.btn(T.green),width:"100%",opacity:loading?.5:1}}>{loading?"...":first?"Passwort setzen":"\u{1F513} Entsperren"}</button>
      {first&&<div style={{fontSize:11,color:T.textMuted,marginTop:16}}>
        {"\u{1F512}"} Alle Daten werden mit AES-256 verschlüsselt.<br/>Dein Passwort wird nirgendwo gespeichert.
      </div>}
    </div>
  </div>
}

/* ============ APP (Local - No Login) ============ */
function App(){
  const[unlocked,setUnlocked]=useState(false);
  const[tab,setTab]=useState("dash");
  const[categories,setCats]=useState([]);const[goals,setGoals]=useState([]);const[entries,setEntries]=useState([]);const[labels,setLabels]=useState([]);
  const[catStats,setCS]=useState([]);const[weekData,setWD]=useState([]);const[loaded,setLoaded]=useState(false);
  const[showCatM,setSCM]=useState(false);const[showGoalM,setSGM]=useState(false);const[showEntryM,setSEM]=useState(false);
  const[editCat,setEC]=useState(null);const[editGoal,setEG]=useState(null);const[editEntry,setEE]=useState(null);
  const[menuOpen,setMenuOpen]=useState(false);
  const[isMobile,setIsMobile]=useState(window.innerWidth<768);
  useEffect(()=>{const h=()=>setIsMobile(window.innerWidth<768);window.addEventListener('resize',h);return()=>window.removeEventListener('resize',h)},[]);

  const loadData=async()=>{try{const[c,g,e,s,lb]=await Promise.all([api.get('categories'),api.get('goals'),api.get('entries'),api.get('stats'),api.get('labels')]);setCats(Array.isArray(c)?c:[]);setGoals(Array.isArray(g)?g:[]);setEntries(Array.isArray(e)?e:[]);setCS(s.catStats||[]);setWD(s.weekData||[]);setLabels(Array.isArray(lb)?lb:[]);setLoaded(true)}catch(e){console.error(e);setLoaded(true)}};

  // On unlock: open DB, check if data exists, restore from backup if needed, then load
  useEffect(()=>{if(!unlocked)return;
    (async()=>{
      await openDB();
      const has=await hasData();
      if(!has){
        const bi=getBackupInfo();
        if(bi){
          console.log('No data in DB, restoring backup from',bi.timestamp,'with',bi.records,'records');
          await restoreFromBackup();
        }
      }
      loadData();
    })();
  },[unlocked]);

  // Auto-backup when app goes to background or closes
  useEffect(()=>{if(!unlocked)return;
    const doBackup=()=>{if(document.visibilityState==='hidden')createBackup()};
    document.addEventListener('visibilitychange',doBackup);
    window.addEventListener('pagehide',()=>createBackup());
    // Also backup every 5 min while active
    const iv=setInterval(()=>createBackup(),5*60*1000);
    return()=>{document.removeEventListener('visibilitychange',doBackup);clearInterval(iv)};
  },[unlocked]);

  useEffect(()=>{const h=()=>loadData();window.addEventListener('tf-reload',h);return()=>window.removeEventListener('tf-reload',h)},[]);

  const catColor=id=>{const i=categories.findIndex(c=>c.id==id);return T.colors[i>=0?i%T.colors.length:0]};
  const catName=id=>categories.find(c=>c.id==id)?.name||"—";

  const saveCat=async d=>{if(editCat)await api.put('categories/'+editCat.id,d);else await api.post('categories',d);setSCM(false);setEC(null);loadData()};
  const delCat=async id=>{await api.del('categories/'+id);loadData()};
  const saveGoal=async d=>{if(editGoal)await api.put('goals/'+editGoal.id,d);else await api.post('goals',d);setSGM(false);setEG(null);loadData()};
  const delGoal=async id=>{await api.del('goals/'+id);loadData()};
  const togGoal=async id=>{await api.post('goals/'+id+'/toggle');loadData()};
  const saveEntry=async d=>{if(d.id)await api.put('entries/'+d.id,d);else await api.post('entries',d);setSEM(false);setEE(null);loadData()};
  const delEntry=async id=>{await api.del('entries/'+id);loadData()};

  // Export all data as encrypted file
  const exportData=async()=>{
    const data={};
    for(const store of STORES){data[store]=await dbAll(store)}
    // Encrypt the whole backup with user's key
    const json=JSON.stringify(data);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const encoded=new TextEncoder().encode(json);
    const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},_cryptoKey,encoded);
    const payload=JSON.stringify({d:btoa(String.fromCharCode(...new Uint8Array(encrypted))),v:btoa(String.fromCharCode(...iv)),t:new Date().toISOString()});
    const blob=new Blob([payload],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='timeflow-backup-'+new Date().toISOString().slice(0,10)+'.tfb';a.click();URL.revokeObjectURL(url);
    await createBackup();
  };
  // Import from encrypted file
  const importData=async()=>{
    const input=document.createElement('input');input.type='file';input.accept='.tfb,.json';
    input.onchange=async e=>{
      const file=e.target.files[0];if(!file)return;
      if(!confirm('Alle bestehenden Daten werden überschrieben. Fortfahren?'))return;
      const text=await file.text();
      let data;
      try{
        const parsed=JSON.parse(text);
        if(parsed.d&&parsed.v){
          // Encrypted .tfb file
          const iv=Uint8Array.from(atob(parsed.v),c=>c.charCodeAt(0));
          const enc=Uint8Array.from(atob(parsed.d),c=>c.charCodeAt(0));
          const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv},_cryptoKey,enc);
          data=JSON.parse(new TextDecoder().decode(decrypted));
        }else{
          // Legacy unencrypted JSON
          data=parsed;
        }
      }catch(err){alert('Entschlüsselung fehlgeschlagen. Falsches Passwort oder beschädigte Datei.');return}
      const db=await openDB();
      for(const store of Object.keys(data)){
        if(!db.objectStoreNames.contains(store))continue;
        const tx=db.transaction(store,'readwrite');const s=tx.objectStore(store);
        await new Promise(r=>{s.clear().onsuccess=r});
        for(const item of data[store]){
          const enc=await encrypt(item);enc.id=item.id;
          try{s.put(enc)}catch(e){}
        }
        await new Promise(r=>{tx.oncomplete=r});
      }
      loadData();await createBackup();alert('Import erfolgreich!');
    };
    input.click();
  };

  if(!unlocked)return<LockScreen onUnlock={()=>setUnlocked(true)}/>;
  if(!loaded)return<div style={{background:T.bg,height:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{color:T.textSec}}>Laden...</div></div>;

  const sh={isMobile,setMenuOpen};
  return<div style={{display:"flex",height:"100vh",background:T.bg,fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif",color:T.text}}>
    <Sidebar tab={tab} setTab={setTab} user={{username:'Lokal'}} onLogout={()=>{}} isMobile={isMobile} isOpen={menuOpen} setIsOpen={setMenuOpen} onExport={exportData} onImport={importData}/>
    <div style={{flex:1,overflowY:"auto",padding:isMobile?"16px 16px 40px":"24px 32px 40px",WebkitOverflowScrolling:"touch"}}>
      {tab==="dash"&&<DashboardTab {...{categories,goals,entries,catColor,catName,loadData,...sh}}/>}
      {tab==="erfassung"&&<ErfassungTab {...{entries,categories,labels,catColor,catName,setSEM,setEditEntry:setEE,deleteEntry:delEntry,loadData,...sh}}/>}
      {tab==="tracking"&&<TrackingTab {...{catColor,catName,loadData,...sh}}/>}
      {tab==="auswertungen"&&<AuswertungenTab {...{catColor,catName,entries,...sh}}/>}
      {tab==="goals"&&<GoalsTab {...{goals,categories,entries,catColor,catName,setSGM,setEG,deleteGoal:delGoal,togGoal,setSEM,loadData,...sh}}/>}
      {tab==="fitness"&&<FitnessTab loadData={loadData} {...sh}/>}
      {tab==="matrix"&&<MatrixTab categories={categories} loadData={loadData} {...sh}/>}
      {tab==="budget"&&<BudgetTab categories={categories} goals={goals} loadData={loadData} {...sh}/>}
      {tab==="lessons"&&<LessonsTab categories={categories} {...sh}/>}
      {tab==="weight"&&<WeightTab {...sh}/>}
      {tab==="cats"&&<CatsTab {...{categories,catColor,catStats,setSCM,setEC,deleteCat:delCat,loadData,...sh}}/>}
    </div>
    <CatModal open={showCatM} onClose={()=>{setSCM(false);setEC(null)}} onSave={saveCat} edit={editCat}/>
    <GoalModal open={showGoalM} onClose={()=>{setSGM(false);setEG(null)}} onSave={saveGoal} edit={editGoal} categories={categories}/>
    <EntryModal open={showEntryM} onClose={()=>{setSEM(false);setEE(null)}} onSave={saveEntry} categories={categories} labels={labels} edit={editEntry}/>
  </div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
